# Lane outputs and repo metrics for the hub's quality-report.sh, which holds no repo specifics.
schema_version = 1

[docs]
build_list = ".github/workflows/docs.yml"
source = "docs"

[[output]]
kind = "benchmark"
path = "bench-history-criterion-x64.json"
artifact = "bench-history-criterion-x64"

[[artifact]]
name = "linux-x64"
kind = "coverage"
format = "cobertura"
path = "cobertura.xml"
artifact = "lane-reports-ubuntu-26.04-x64"
workflow = "linux-x64.yml"

[[artifact]]
name = "ort-license"
kind = "mutation"
path = "logs/code-quality/mutations/report.txt"
artifact = "mutation-gates-*"
workflow = "ort-license-mutations.yml"

# cargo doc prints its warnings to the job log only, so this is read from a local tee.
[[artifact]]
name = "rustdoc_warnings"
kind = "count"
unit = "warnings"
path = "logs/code-quality/rustdoc.txt"
artifact = "lane-reports-ubuntu-26.04-x64"
workflow = "linux-x64.yml"
pattern = '^warning: (?!.*generated \d+ warnings?)'
location = '-->\s+(?P<path>[^:\s]+):(?P<line>\d+)'

# The bridge file is generated, so its unsafe blocks move with the API, not with hand-written code.
[[metric]]
name = "unsafe_blocks"
kind = "pattern"
unit = "blocks"
pattern = '\bunsafe\s*\{'
include = ["*.rs"]
exclude = ["third_party/*", "src/frb_generated*.rs"]

# quality-report.sh --perf-host, inside :latest; DNNL answers not_collected while the image lacks libdnnl.so.3.
[perf]
setup = "bash scripts/linux/perf-host.sh setup"

[[perf.command]]
name = "detector_cpu"
run = "KATAGLYPHIS_ORT_DEVICE=cpu target/release/kataglyphis_cli detect-latency --image third_party/ModelANT/contracts/fixtures/two_cats.jpg --runs 30"
metrics = [{ key = "p50_ms", unit = "ms", better = "lower" }, { key = "p95_ms", unit = "ms", better = "lower" }]

[[perf.command]]
name = "detector_xnnpack"
run = "KATAGLYPHIS_ORT_DEVICE=xnnpack target/release/kataglyphis_cli detect-latency --image third_party/ModelANT/contracts/fixtures/two_cats.jpg --runs 30"
metrics = [{ key = "p50_ms", unit = "ms", better = "lower" }, { key = "p95_ms", unit = "ms", better = "lower" }]

[[perf.command]]
name = "detector_dnnl"
run = "KATAGLYPHIS_ORT_DEVICE=dnnl target/release/kataglyphis_cli detect-latency --image third_party/ModelANT/contracts/fixtures/two_cats.jpg --runs 30"
metrics = [{ key = "p50_ms", unit = "ms", better = "lower" }, { key = "p95_ms", unit = "ms", better = "lower" }]

[[perf.command]]
name = "text_rust"
run = "bash scripts/linux/perf-host.sh text"
metrics = [{ key = "ttft_ms", unit = "ms", better = "lower" }, { key = "decode_tok_s", unit = "tok/s", better = "higher" }]
