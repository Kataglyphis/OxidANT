# Lane outputs and repo metrics for the hub's quality-report.sh, which holds no repo specifics.
schema_version = 1

[docs]
build_list = ".github/workflows/docs.yml"
source = "docs"

[[output]]
kind = "benchmark"
path = "bench-history-criterion-x64.json"
artifact = "bench-history-criterion-x64"

[[artifact]]
name = "linux-x64"
kind = "coverage"
format = "cobertura"
path = "cobertura.xml"
artifact = "lane-reports-ubuntu-26.04-x64"
workflow = "linux-x64.yml"

[[artifact]]
name = "ort-license"
kind = "mutation"
path = "logs/code-quality/mutations/report.txt"
artifact = "mutation-gates-*"
workflow = "ort-license-mutations.yml"

# cargo doc prints its warnings to the job log only, so this is read from a local tee.
[[artifact]]
name = "rustdoc_warnings"
kind = "count"
unit = "warnings"
path = "logs/code-quality/rustdoc.txt"
artifact = "lane-reports-ubuntu-26.04-x64"
workflow = "linux-x64.yml"
pattern = '^warning: (?!.*generated \d+ warnings?)'
location = '-->\s+(?P<path>[^:\s]+):(?P<line>\d+)'

# rust-mutants.yml's weekly groups: a missed mutant is one line; only a run at the report's own commit is read.
[[artifact]]
name = "mutants_missed_network"
kind = "count"
unit = "mutants"
path = "logs/mutants/network/mutants.out/missed.txt"
artifact = "mutants-network"
workflow = "rust-mutants.yml"
pattern = '\S'
location = '^(?P<path>[^:\s]+):(?P<line>\d+)'

[[artifact]]
name = "mutants_missed_arrival"
kind = "count"
unit = "mutants"
path = "logs/mutants/arrival/mutants.out/missed.txt"
artifact = "mutants-arrival"
workflow = "rust-mutants.yml"
pattern = '\S'
location = '^(?P<path>[^:\s]+):(?P<line>\d+)'

[[artifact]]
name = "mutants_missed_camera"
kind = "count"
unit = "mutants"
path = "logs/mutants/camera/mutants.out/missed.txt"
artifact = "mutants-camera"
workflow = "rust-mutants.yml"
pattern = '\S'
location = '^(?P<path>[^:\s]+):(?P<line>\d+)'

[[artifact]]
name = "mutants_missed_media"
kind = "count"
unit = "mutants"
path = "logs/mutants/media/mutants.out/missed.txt"
artifact = "mutants-media"
workflow = "rust-mutants.yml"
pattern = '\S'
location = '^(?P<path>[^:\s]+):(?P<line>\d+)'

[[artifact]]
name = "mutants_missed_capture"
kind = "count"
unit = "mutants"
path = "logs/mutants/capture/mutants.out/missed.txt"
artifact = "mutants-capture"
workflow = "rust-mutants.yml"
pattern = '\S'
location = '^(?P<path>[^:\s]+):(?P<line>\d+)'

[[artifact]]
name = "mutants_missed_session"
kind = "count"
unit = "mutants"
path = "logs/mutants/session/mutants.out/missed.txt"
artifact = "mutants-session"
workflow = "rust-mutants.yml"
pattern = '\S'
location = '^(?P<path>[^:\s]+):(?P<line>\d+)'

# The hub cargo_test.sh writes it from the test step's log; libtest prints no per-test time.
[[artifact]]
name = "cargo-test"
kind = "junit"
path = "logs/test-results/cargo-test.xml"
artifact = "lane-reports-ubuntu-26.04-x64"
workflow = "linux-x64.yml"

# The bridge file is generated, so its unsafe blocks move with the API, not with hand-written code.
[[metric]]
name = "unsafe_blocks"
kind = "pattern"
unit = "blocks"
pattern = '\bunsafe\s*\{'
include = ["*.rs"]
exclude = ["third_party/*", "src/frb_generated*.rs"]

# AGENTS.md's owner rule: no crate has a Cargo feature; run-lint-gates.sh fails on a [features] table.
[[metric]]
name = "cargo_features_tables"
kind = "pattern"
unit = "tables"
pattern = '^\s*\[features\]'
include = ["Cargo.toml", "*/Cargo.toml"]
exclude = ["third_party/*"]
max = 0

# quality-report.sh --perf-host, inside :latest; DNNL answers not_collected while the image lacks libdnnl.so.3.
[perf]
setup = "bash scripts/linux/perf-host.sh setup"

[[perf.command]]
name = "detector_cpu"
run = "KATAGLYPHIS_ORT_DEVICE=cpu target/release/kataglyphis_cli detect-latency --image third_party/ModelANT/contracts/fixtures/two_cats.jpg --runs 30"
metrics = [{ key = "p50_ms", unit = "ms", better = "lower" }, { key = "p95_ms", unit = "ms", better = "lower" }]

[[perf.command]]
name = "detector_xnnpack"
run = "KATAGLYPHIS_ORT_DEVICE=xnnpack target/release/kataglyphis_cli detect-latency --image third_party/ModelANT/contracts/fixtures/two_cats.jpg --runs 30"
metrics = [{ key = "p50_ms", unit = "ms", better = "lower" }, { key = "p95_ms", unit = "ms", better = "lower" }]

[[perf.command]]
name = "detector_dnnl"
run = "KATAGLYPHIS_ORT_DEVICE=dnnl target/release/kataglyphis_cli detect-latency --image third_party/ModelANT/contracts/fixtures/two_cats.jpg --runs 30"
metrics = [{ key = "p50_ms", unit = "ms", better = "lower" }, { key = "p95_ms", unit = "ms", better = "lower" }]

[[perf.command]]
name = "text_rust"
run = "bash scripts/linux/perf-host.sh text"
metrics = [{ key = "ttft_ms", unit = "ms", better = "lower" }, { key = "decode_tok_s", unit = "tok/s", better = "higher" }]

# A five-turn chat continues its generator: turn 5's first token stays near turn 1's.
[[perf.command]]
name = "text_turns_rust"
run = "bash scripts/linux/perf-host.sh text-turns"
metrics = [{ key = "turn1_ttft_ms", unit = "ms", better = "lower" }, { key = "turn5_ttft_ms", unit = "ms", better = "lower" }]
