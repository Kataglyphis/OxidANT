[graph]
all-features = true
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "riscv64-unknown-linux-gnu",
]

[advisories]
version = 2
yanked = "deny"
# Must match .cargo/audit.toml; `advisory-not-detected` means an ignore is stale, so delete it.
ignore = [
  "RUSTSEC-2025-0141", # bincode: unmaintained (via burn-core)
  "RUSTSEC-2024-0436", # paste: unmaintained (via burn-ndarray, cubecl-core)
  "RUSTSEC-2026-0192", # ttf-parser: unmaintained (transitive font-parsing dep); informational, not a vulnerability
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "OFL-1.1",
  "Ubuntu-font-1.0",
  "CDLA-Permissive-2.0",
  "Unlicense",
  # xxhash-rust via burn; permissive, with no binary attribution, unlike MIT/BSD/ISC.
  "BSL-1.0",
]

[sources]
unknown-registry = "deny"
allow-git = []
