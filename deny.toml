[graph]
all-features = true
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "riscv64-unknown-linux-gnu",
]

[advisories]
version = 2
yanked = "deny"
# Unmaintained transitive deps from burn (0.21.0) - no upgrade available.
# Re-check after the next burn upgrade. cargo-deny DOES say when an ignore has
# gone stale (`warning[advisory-not-detected]`), so treat that warning as a
# deletion request rather than noise - it is what removed the two quick-xml
# entries that used to sit here.
#
# THIS LIST AND .cargo/audit.toml MUST MATCH. cargo-audit reads only its own
# file, cargo-deny only this one, and both run in the same gating CI step, so
# an id added to one is still reported by the other.
ignore = [
  "RUSTSEC-2025-0141", # bincode: unmaintained (via burn-core)
  "RUSTSEC-2024-0436", # paste: unmaintained (via burn-ndarray, cubecl-core)
  "RUSTSEC-2026-0192", # ttf-parser: unmaintained (transitive font-parsing dep); informational, not a vulnerability
  # The two quick-xml entries (RUSTSEC-2026-0194 / -0195) are gone: quick-xml
  # moved to 0.41.0 in Cargo.lock, which carries the fix, and cargo-deny then
  # warned `advisory-not-detected` on both. Take the upgrade and delete the
  # ignore - an ignore that no longer matches is a claim nobody re-checks.
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "OFL-1.1",
  "Ubuntu-font-1.0",
  "CDLA-Permissive-2.0",
  "Unlicense",
  # xxhash-rust, via cubecl-common -> burn. Boost Software License 1.0 is
  # OSI-approved and permissive - no attribution required in binary form, so
  # strictly less demanding than the MIT/BSD/ISC entries already above it.
  # Without this the licenses check FAILS; it was the only rejection.
  "BSL-1.0",
]

[sources]
unknown-registry = "deny"
allow-git = []
