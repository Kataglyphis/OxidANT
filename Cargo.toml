[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/telemetry",
    "crates/inference",
    "crates/media",
    "crates/gui",
    "crates/cli",
    "crates/webgpu_renderer",
    "crates/cat_webrtc",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Kataglyphis/OxidANT"
# THE FLOOR OF THE RESOLVED GRAPH, not a wish. It read 1.92.0 and was false:
# sysinfo 0.39.6 and every egui 0.36 crate declare 1.95, and kstring 2.0.4
# declares 1.96.0, so `cargo +1.92 check --locked` cannot have worked. The
# abandoned main branch "fixed" the same contradiction the other way in 4438964
# (resolver 3 + sysinfo 0.38) because the image shipped rustc 1.93.1 at the time;
# that is not the trade today - versions.env pins RUST_VERSION 1.98.1 and the
# image ships it, so the honest move is to declare what the lockfile actually
# needs rather than downgrade a dependency to meet a number nobody verified.
# Recompute after a lockfile bump: the max `rust_version` in `cargo metadata`.
rust-version = "1.96.0"

[workspace.dependencies]
log = "0.4"
env_logger = "0.11.10"
anyhow = "1"
chrono = "0.4"
tokio = "1"
clap = { version = "4", features = ["derive"] }
burn = { version = "0.21.0", default-features = false }
burn-autodiff = { version = "0.21.0" }
burn-ndarray = { version = "0.21.0" }
ndarray = { version = "0.17" }
plotters = { version = "0.3" }
tempfile = { version = "3" }
# load-dynamic on the declaration, not a feature: no feature set can link ORT
# (owner rule 2026-09-23). scripts/linux/check-ort-chain-only.sh enforces it.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "api-24"] }
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
libloading = "0.9"
sysinfo = "0.39"
flutter_rust_bridge = "=2.13.0"
wmi = "0.18"

[package]
name = "oxidant"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust project template with optional GUI, ONNX backends, profiling, packaging, and CI workflows."
readme = "README.md"
rust-version.workspace = true

[lib]
name = "oxidant"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
gui = ["kataglyphis_gui/gui"]
gui_unix = ["kataglyphis_gui/gui_unix"]
gui_linux = ["kataglyphis_gui/gui_linux"]
gui_wgpu = ["kataglyphis_gui/gui_wgpu"]
gui_windows = ["kataglyphis_gui/gui_windows"]
onnx_tract = ["kataglyphis_inference/onnx_tract"]
onnxruntime = ["kataglyphis_inference/onnxruntime", "dep:ort", "ort/std"]
# An alias since 2026-09-23: every `onnxruntime*` feature runtime-loads the
# family's chain-built ONNX Runtime now and none downloads one at build time
# (crates/inference/Cargo.toml says why). Kept because OmniAccelerANT's
# KATAGLYPHIS_RUST_FEATURES names it.
onnxruntime_dynamic = ["onnxruntime", "kataglyphis_inference/onnxruntime_dynamic"]
onnxruntime_directml = ["kataglyphis_inference/onnxruntime_directml"]
onnxruntime_cuda = ["kataglyphis_inference/onnxruntime_cuda"]
# GStreamer-backed webcam capture (crates/media) + the webcam→inference engine.
gstreamer = ["dep:kataglyphis_media", "kataglyphis_media/gstreamer", "dep:libloading"]
burn_demos = ["dep:burn", "dep:burn-autodiff", "dep:burn-ndarray", "dep:ndarray", "dep:plotters", "dep:tempfile", "onnxruntime"]

[dependencies]
kataglyphis_core = { path = "crates/core" }
kataglyphis_telemetry = { path = "crates/telemetry" }
kataglyphis_inference = { path = "crates/inference", optional = true }
kataglyphis_media = { path = "crates/media", optional = true }
kataglyphis_gui = { path = "crates/gui", optional = true }
clap = { workspace = true }

log = { workspace = true }
env_logger = { workspace = true }

flutter_rust_bridge = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
sysinfo = { workspace = true }

burn = { workspace = true, features = ["std", "ndarray", "autodiff"], optional = true }
burn-autodiff = { workspace = true, optional = true }
burn-ndarray = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }
plotters = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
ort = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cxx = "1.0"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt", "time", "sync"] }
js-sys = "0.3"
wasm-bindgen = "0.2"

[target.'cfg(windows)'.dependencies]
serde = { version = "1", features = ["derive"] }
wmi = { workspace = true }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)', 'cfg(onnx)', 'cfg(gui_wgpu_backend)'] }

[workspace.lints.clippy]
# NEW IN CLIPPY 1.98, and the reason rust_ubuntu26_04.yml's "Check formatting
# and clippy" step went red the moment the hub pin moved to fa9ecdb6
# (versions.env RUST_VERSION 1.97.1 -> 1.98.1). It fires 22 times, all inside
# crates/webgpu_renderer, on `chunks_exact(N)` with a literal N.
#
# It is a style lint, not a correctness one: `as_chunks::<N>().0` iterates the
# same elements and drops the same remainder, it just yields `&[T; N]` instead
# of `&[T]`. Migrating means changing the element type at 22 call sites in the
# glTF loader, the HDR decoder and four render passes - a renderer refactor
# that has no business riding along in a documentation-and-CI audit, and
# `cargo clippy --fix` does not converge on it (it rewrote the test files and
# left every src site). Allowed HERE, once, rather than sprinkled as
# #[allow] attributes, so removing it is one line. Tracked in BACKLOG.md.
#
# Everything else stays at -D warnings.
chunks_exact_to_as_chunks = "allow"

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
proptest = "1.11"

[build-dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.build-dependencies]
cxx-build = "1.0"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "--enable-threads", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.profile]
inherits = "release"
debug = true
strip = "none"

[profile.dev.package."*"]
opt-level = 2

[[bin]]
name = "burn-demos"
path = "src/bin/burn_demos.rs"
required-features = ["burn_demos"]
