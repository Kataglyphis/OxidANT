[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/telemetry",
    "crates/inference",
    "crates/media",
    "crates/gui",
    "crates/cli",
    "crates/webgpu_renderer",
    "crates/observant",
    "crates/esp32",
    "crates/esp32-protocol",
    "crates/burn_demos",
]

[workspace.package]
# The one version (owner, 2026-10-15): CI, the packages and the MSIX read it here.
version = "3.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Kataglyphis/OxidANT"
# The resolved graph's floor: recompute after a lockfile bump as the max `rust_version` in `cargo metadata`.
rust-version = "1.96.0"

[patch.crates-io]
# Until egui 0.37: no published egui-winit compiles for wasm32 (egui#8436); see third_party/egui-winit-0.36.2/PATCHED.md.
egui-winit = { path = "third_party/egui-winit-0.36.2" }
# tract-linalg 0.23.8 (0.23.9 alike) hands clang-cl MASM for its AVX-512 VNNI kernels; see third_party/tract-linalg-0.23.8/PATCHED.md.
tract-linalg = { path = "third_party/tract-linalg-0.23.8" }

[workspace.dependencies]
# Benches only; without plotters and rayon, which no report here needs.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.11"
log = "0.4"
env_logger = "0.11.10"
anyhow = "1"
chrono = "0.4"
tokio = "1"
clap = { version = "4", features = ["derive"] }
burn = { version = "0.22.0", default-features = false }
ndarray = { version = "0.17" }
# ab_glyph, not font-kit: no system fontconfig or freetype to link, on any target.
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "line_series", "ab_glyph"] }
tempfile = { version = "3" }
# load-dynamic on the declaration so no feature set can link ORT; scripts/linux/check-ort-chain-only.sh enforces it.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "api-24"] }
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
libloading = "0.9"
sysinfo = "0.39"
flutter_rust_bridge = "=2.13.0"
wmi = "0.18"

[package]
name = "oxidant"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Kataglyphis family's Rust core: the flutter_rust_bridge API OmniAccelerANT calls and the cxx bridge BeschleunigerBallett links."
readme = "README.md"
rust-version.workspace = true

[lib]
name = "oxidant"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
kataglyphis_core = { path = "crates/core" }
kataglyphis_telemetry = { path = "crates/telemetry" }
clap = { workspace = true }

log = { workspace = true }
env_logger = { workspace = true }

flutter_rust_bridge = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
sysinfo = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cxx = "1.0"
# tract everywhere, the chain ORT first where the family builds one; wasm32 has no file system to load a model from.
kataglyphis_inference = { path = "crates/inference" }
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "time"] }

# Desktop only: Android and wasm have no serial port for the ESP32-S3 companion and no GStreamer for the webcam engine.
[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
kataglyphis_esp32 = { path = "crates/esp32" }
kataglyphis_media = { path = "crates/media" }
libloading = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt", "time", "sync"] }
js-sys = "0.3"
wasm-bindgen = "0.2"

[target.'cfg(windows)'.dependencies]
serde = { version = "1", features = ["derive"] }
wmi = { workspace = true }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)', 'cfg(desktop)'] }

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[build-dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.build-dependencies]
cxx-build = "1.0"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "--enable-threads", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.profile]
inherits = "release"
debug = true
strip = "none"

[profile.dev.package."*"]
opt-level = 2
