[package]
name = "kataglyphis_cxx_bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The cxx bridge BeschleunigerBallett's C++ engine links through Corrosion, without the root package's GStreamer and ONNX Runtime."

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
cxx = "1.0"
# The CPU glTF loader without the renderer's wgpu, winit and egui, which the engine would link for nothing.
kataglyphis_assets = { path = "../assets" }
# The settings, their ranges and sanitize rules, without the renderer's wgpu.
kataglyphis_render_core = { path = "../render_core" }
# The loader's warnings, which `diagnostics` keeps for the engine to drain.
log = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
