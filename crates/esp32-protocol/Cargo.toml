[package]
name = "kataglyphis_esp32_proto"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Framed USB-serial protocol shared by OmniAccelerANT and its ESP32-S3 firmware."

[dependencies]
# No std on either side: the same crate is built for the Xtensa firmware and the host.
postcard = { version = "1.1", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
