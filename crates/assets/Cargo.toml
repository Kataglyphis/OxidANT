[package]
name = "kataglyphis_assets"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CPU-side glTF and KTX2 loading into the CpuScene types; no GPU, window or UI dependency."

[dependencies]
anyhow = { workspace = true }
log = { workspace = true }
bytemuck = { version = "1.25", features = ["derive"] }
glam = { version = "0.34", features = ["bytemuck"] }
# guess_mime_type sniffs PNG/JPEG bytes when a URI's extension or a MIME type is not the exact lowercase one.
gltf = { version = "1", features = ["import", "guess_mime_type", "KHR_lights_punctual", "KHR_texture_transform", "KHR_materials_emissive_strength", "KHR_materials_unlit", "extensions"] }
# Not the `mikktspace` crate: it pulls nalgebra 0.26, which is future-incompatible on current rustc.
bevy_mikktspace = "1"
ktx2 = "0.5"
# Pure Rust for wasm32; no zstd feature, whose ruzstd 0.7 has RUSTSEC-2026-0344: ktx2_zstd.rs inflates.
basisu = { version = "0.1", default-features = false, features = ["std"] }
# Zstandard KTX2 levels; 0.9.1 bounds a block's output (RUSTSEC-2026-0344). No `hash`: frame checksums go unchecked.
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
