[package]
name = "kataglyphis_vision_core_web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "kataglyphis_vision_core for the browser: wasm-bindgen exports for the preprocess, the decode and the COCO names."

[lib]
# cdylib for wasm-bindgen; rlib for the native tests and the contract report.
crate-type = ["cdylib", "rlib"]

[dependencies]
kataglyphis_vision_core = { path = "../vision_core" }
wasm-bindgen = "0.2"
# A refusal reaches JS as an Error whose name is its kind.
js-sys = "0.3"

[lints]
workspace = true

[dev-dependencies]
# The COCO names must be the list the native detector labels with.
kataglyphis_core = { path = "../core" }
# examples/contract_report.rs reads ModelANT's inference-v1.json and hashes each result.
serde_json = "1"
sha2 = "0.10"
