[package]
name = "kataglyphis_inference"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
onnx_tract = ["dep:tract-onnx", "onnx"]
# Always load-dynamic, and only the family's chain-built ORT (owner rule
# 2026-09-23): `download-binaries` fetched pyke's prebuilt ORT and must never
# come back - scripts/linux/check-ort-chain-only.sh fails the lane if it does.
# load-dynamic implies ort-sys/disable-linking (no download, no link);
# src/ort_runtime.rs picks the dylib. api-24 is required with load-dynamic.
onnxruntime =["dep:ort", "ort/std", "ort/ndarray", "ort/load-dynamic", "ort/api-24", "onnx"]
# Kept as an alias: OmniAccelerANT's KATAGLYPHIS_RUST_FEATURES and
# crates/cat_webrtc still name it. It adds nothing over `onnxruntime` now.
onnxruntime_dynamic = ["onnxruntime"]
# The EP features only register the provider; the loaded chain dylib must
# carry it (the Windows chain is built with DirectML).
onnxruntime_directml = ["onnxruntime", "ort/directml"]
onnxruntime_cuda = ["onnxruntime", "ort/cuda"]
onnx = [] # Internal marker feature

[dependencies]
anyhow = { workspace = true }
log = { workspace = true }
kataglyphis_core = { path = "../core" }

# ONNX inference (optional)
tract-onnx = { version = "0.23", optional = true }
ort = { workspace = true, optional = true }

[lints]
workspace = true
