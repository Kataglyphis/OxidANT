[package]
name = "kataglyphis_inference"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
onnx_tract = ["dep:tract-onnx", "onnx"]
# Always load-dynamic so only the chain-built ORT loads; check-ort-chain-only.sh fails on download-binaries.
onnxruntime =["dep:ort", "ort/std", "ort/ndarray", "ort/load-dynamic", "ort/api-24", "onnx"]
# Alias kept because OmniAccelerANT's KATAGLYPHIS_RUST_FEATURES and crates/cat_webrtc name it.
onnxruntime_dynamic = ["onnxruntime"]
# EP features only register the provider; the loaded chain dylib must carry it.
onnxruntime_directml = ["onnxruntime", "ort/directml"]
onnxruntime_cuda = ["onnxruntime", "ort/cuda"]
onnx = [] # Internal marker feature

[dependencies]
anyhow = { workspace = true }
log = { workspace = true }
kataglyphis_core = { path = "../core" }

# ONNX inference (optional)
tract-onnx = { version = "0.23", optional = true }
ort = { workspace = true, optional = true }

[lints]
workspace = true
