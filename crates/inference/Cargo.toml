[package]
name = "kataglyphis_inference"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
log = { workspace = true }
kataglyphis_core = { path = "../core" }
# The fallback when ORT fails, and the only backend where the family builds no ORT (Android).
tract-onnx = "0.23"

# The chain ORT exists for Linux and Windows only; load-dynamic comes from the workspace declaration.
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
ort = { workspace = true, features = ["std", "ndarray", "cuda"] }

# DirectML is a Windows-only execution provider; the loaded chain dylib must carry it.
[target.'cfg(windows)'.dependencies]
ort = { workspace = true, features = ["directml"] }

[lints]
workspace = true

[dev-dependencies]
criterion = { workspace = true }
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[[bench]]
name = "detector"
harness = false
