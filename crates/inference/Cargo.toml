[package]
name = "kataglyphis_inference"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.kataglyphis]
# Consumers can check this marker before selecting a GPU device.
ort-devices = ["cuda", "migraphx", "directml"]

[dependencies]
anyhow = { workspace = true }
log = { workspace = true }
kataglyphis_core = { path = "../core" }
# The ORT fallback and Android's only backend; exact, as the patched third_party/tract-linalg-0.23.8 drops out at any other version.
tract-onnx = "=0.23.8"

# The chain ORT exists for Linux and Windows only; load-dynamic comes from the workspace declaration.
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
ort = { workspace = true, features = ["std", "ndarray", "cuda", "migraphx"] }

# DirectML is a Windows-only execution provider; the loaded chain dylib must carry it.
[target.'cfg(windows)'.dependencies]
ort = { workspace = true, features = ["directml"] }

[lints]
workspace = true

[dev-dependencies]
criterion = { workspace = true }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
serde_json = "1"

[[bench]]
name = "detector"
harness = false
