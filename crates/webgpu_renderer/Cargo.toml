[package]
name = "kataglyphis_webgpu_renderer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WebGPU (wgpu) renderer with glTF loading; runs native and on wasm32 via WebGPU."
readme = "README.md"

[lib]
# cdylib for wasm-bindgen's browser demo; rlib for dependents, tests and examples.
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
wgpu = "30"
winit = "0.30"
pollster = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
glam = { version = "0.33", features = ["bytemuck"] }
gltf = { version = "1", features = ["import", "KHR_lights_punctual", "KHR_texture_transform", "KHR_materials_emissive_strength", "KHR_materials_unlit", "extensions"] }
# Not the `mikktspace` crate: it pulls nalgebra 0.26, which is future-incompatible on current rustc.
bevy_mikktspace = "1"
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = { version = "0.36", default-features = false }
ktx2 = "0.5"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
# Shader interop with the C++ Vulkan engine: WGSL -> SPIR-V / GLSL.
naga = { version = "30", features = ["wgsl-in", "spv-out", "glsl-out"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
console_log = "1"
js-sys = "0.3"
# Node + EventTarget are Element's deref chain, needed to attach the drag-and-drop listeners.
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "HtmlCanvasElement",
    "Node",
    "EventTarget",
    "DragEvent",
    "DataTransfer",
    "FileList",
    "File",
    "Performance",
] }

[lints]
workspace = true
