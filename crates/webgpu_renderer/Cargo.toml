[package]
name = "kataglyphis_webgpu_renderer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WebGPU (wgpu) renderer with glTF loading; runs native and on wasm32 via WebGPU."
readme = "README.md"

[lib]
# cdylib for wasm-bindgen's browser demo; rlib for dependents, tests and examples.
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
wgpu = "30"
winit = "0.30"
pollster = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
glam = { version = "0.34", features = ["bytemuck"] }
# guess_mime_type sniffs PNG/JPEG bytes when a URI's extension or a MIME type is not the exact lowercase one.
gltf = { version = "1", features = ["import", "guess_mime_type", "KHR_lights_punctual", "KHR_texture_transform", "KHR_materials_emissive_strength", "KHR_materials_unlit", "extensions"] }
# Not the `mikktspace` crate: it pulls nalgebra 0.26, which is future-incompatible on current rustc.
bevy_mikktspace = "1"
# The skybox's PNG faces and an in-memory OBJ's textures; gltf already builds this crate and JPEG, BMP and TGA add no crate.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tga"] }
egui = "0.37"
egui-wgpu = "0.37"
egui-winit = { version = "0.37", default-features = false }
ktx2 = "0.5"
# Pure Rust, so the wasm32 demo transcodes Basis KTX2 too without a C++ toolchain for wasm32.
basisu = "0.1"

[dev-dependencies]
# Shader interop with the C++ Vulkan engine: WGSL -> SPIR-V / GLSL.
naga = { version = "30", features = ["wgsl-in", "spv-out", "glsl-out"] }
# Pins the embedded fonts and their licence texts to BeschleunigerBallett's copies.
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
console_log = "1"
js-sys = "0.3"
# Node + EventTarget are Element's deref chain, needed to attach the drag-and-drop listeners.
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "HtmlCanvasElement",
    "Node",
    "EventTarget",
    "DragEvent",
    "DataTransfer",
    "FileList",
    "File",
    "Performance",
    "KeyboardEvent",
    # The library's URL scenes: a streamed fetch with progress, and the page's ?scene-base=.
    "Location",
    "Response",
    "Headers",
    "ReadableStream",
    "ReadableStreamDefaultReader",
] }

# Its JSON schema has unit tests, which `cargo test` runs only for an example marked so.
[[example]]
name = "dump_gpu_timings"
test = true

# Its shot camera has a unit test.
[[example]]
name = "editor_snapshot"
test = true

[lints]
workspace = true
