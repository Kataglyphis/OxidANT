[package]
name = "kataglyphis_gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = { workspace = true }
log = { workspace = true }
kataglyphis_core = { path = "../core" }
kataglyphis_inference = { path = "../inference" }
# Its GStreamer init points GST_PLUGIN_PATH at the plugins a package carries beside the exe.
kataglyphis_media = { path = "../media" }
kataglyphis_telemetry = { path = "../telemetry" }
tokio = { version = "1", features = ["sync", "time"] }
chrono = { workspace = true }

# Workspace-pinned so this and crates/media never link two GStreamer versions against one libgstreamer.
gstreamer = { workspace = true }
gstreamer-app = { workspace = true }
winit = { version = "0.30" }
# No GL backend, which GpuBackend never picks: its opengl32.dll import keeps the exe from loading in Server Core.
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl"] }
pollster = { version = "1.0" }
bytemuck = { version = "1.25", features = ["derive"] }
egui = { version = "0.36" }
egui-winit = { version = "0.36" }
# Its defaults turn wgpu's GL backend back on.
egui-wgpu = { version = "0.36", default-features = false }
sysinfo = { workspace = true }

[lints]
workspace = true
