[package]
name = "kataglyphis_cat_webrtc"
version.workspace = true
edition.workspace = true
license.workspace = true

# Cat cam service publishing YOLO cat boxes over webrtcsink and serving its web client, OmniAccelerANT's Stream page.

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
log = { workspace = true }
kataglyphis_core = { path = "../core" }
kataglyphis_inference = { path = "../inference", features = ["onnxruntime_dynamic"] }
kataglyphis_media = { path = "../media", features = ["gstreamer"] }
gstreamer = { workspace = true }
gstreamer-app = { workspace = true }
sysinfo = { workspace = true }
# The web server: all already in the lockfile but hyper's httpdate and tokio's signal-hook-registry.
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "fs", "macros", "signal", "time"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
httparse = "1"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
