name: Linux x64 · AMD GPU package candidate

on:
  workflow_dispatch:
    inputs:
      invocation-scope:
        description: Unique lowercase scope for overlapping calls in the same run
        type: string
        default: default
      verify-gpu:
        description: Profile packaged inference on a self-hosted AMD ROCm GPU runner
        type: boolean
        default: false
      promote-verified:
        description: Stage checked AMD packages as a separate artifact after hardware profiling
        type: boolean
        default: false
  workflow_call:
    inputs:
      invocation-scope:
        type: string
        default: default
      verify-gpu:
        type: boolean
        default: false
      promote-verified:
        type: boolean
        default: false
    secrets:
      GHCR_PAT:
        required: false

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      suffix: ${{ steps.scope.outputs.suffix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Validate the invocation scope
        id: scope
        env:
          GPU_INVOCATION_SCOPE: ${{ inputs.invocation-scope }}
        run: python3 -I third_party/ANTfrastructure/shared/python/gpu_invocation_scope.py

  build:
    name: Build AMD GPU package (host ROCm required)
    needs: scope
    runs-on: ubuntu-26.04
    concurrency:
      group: linux-x64-amd-gpu-${{ github.ref }}-${{ github.workflow }}-${{ needs.scope.outputs.suffix }}
      cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
    timeout-minutes: 240
    outputs:
      artifact_prefix: ${{ steps.name.outputs.artifact_prefix }}
      producer_attempt: ${{ steps.name.outputs.producer_attempt }}
      artifact_id: ${{ steps.promotion_upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.promotion_upload.outputs.artifact-digest }}
      artifact_files: ${{ steps.promotion_files.outputs.files }}
    env:
      REF_NAME: ${{ github.ref_name }}
      RUN_NUMBER: ${{ github.run_number }}
    steps:
      - name: Require CPU and GPU detector parity for promotion
        if: ${{ inputs.promote-verified }}
        run: |
          echo '::error::Promotion is disabled until CPU and GPU detector output parity is verified.'
          exit 1
      - name: Require hardware profiling for promotion
        if: ${{ inputs.promote-verified && !inputs.verify-gpu }}
        run: |
          echo '::error::Promotion requires verify-gpu and the hardware profile.'
          exit 1
      - name: Check out the pinned sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Check pinned GPU verification APIs
        shell: bash
        run: |
          set -euo pipefail
          hub=third_party/ANTfrastructure/linux/scripts/06-packaging
          test -f "$hub/verify-ort-appimage-payload.sh" || { echo 'Pinned ANTfrastructure lacks the finished GPU AppImage verifier' >&2; exit 1; }
          if ! test -f "$hub/ort-runtime-bundle.sh" || ! grep -q 'ort_assert_no_bundled_host_runtime' "$hub/ort-runtime-bundle.sh"; then
            echo 'Pinned ANTfrastructure lacks the GPU host-runtime exclusion check' >&2; exit 1
          fi
          if ! test -f "$hub/../01-core/platform.sh" || ! grep -q '^arch_normalize()' "$hub/../01-core/platform.sh"; then
            echo 'Pinned ANTfrastructure lacks GPU package architecture normalization' >&2; exit 1
          fi
          model_verifier=third_party/ANTfrastructure/shared/python/verify_locked_files.py
          model_fetcher=third_party/ANTfrastructure/linux/scripts/lib/fetch-data-lock.py
          parity_comparator=third_party/ANTfrastructure/shared/python/compare_detector_parity.py
          parity_tests=third_party/ANTfrastructure/shared/python/tests/test_compare_detector_parity.py
          ort_profile=third_party/ANTfrastructure/shared/python/verify_ort_profile.py
          profile_env=third_party/ANTfrastructure/linux/scripts/lib/gpu-profile-env.sh
          if ! test -f "$profile_env" || ! grep -q '^gpu_without_migraphx_overrides()' "$profile_env"; then
            echo 'Pinned ANTfrastructure lacks GPU profile environment isolation' >&2; exit 1
          fi
          if ! test -f "$parity_comparator" || ! test -f "$parity_tests"; then
            echo 'Pinned ANTfrastructure lacks detector parity comparison and tests' >&2; exit 1
          fi
          python3 -I "$parity_comparator" --help | grep -q -- --pairwise || { echo 'Pinned ANTfrastructure lacks pairwise detector comparison' >&2; exit 1; }
          python3 -I "$ort_profile" --help | grep -q -- --min-runs || { echo 'Pinned ANTfrastructure lacks per-run ORT profiling' >&2; exit 1; }
          if ! test -f "$model_verifier" || ! test -f "$model_fetcher" || ! grep -q '^def read_lock(' "$model_fetcher" || ! grep -q '^def matches(' "$model_fetcher"; then
            echo 'Pinned ANTfrastructure lacks locked-model verification APIs' >&2; exit 1
          fi
          python3 "$hub/stage-ort-wheel-licenses.py" --help | grep -q -- --require-unstripped || { echo 'Pinned ANTfrastructure lacks exact GPU wheel verification' >&2; exit 1; }
          bash scripts/linux/tests/test-verify-gpu-packages.sh
          bash scripts/linux/tests/test-profile-gpu-bundle.sh
          bash scripts/linux/tests/test-profile-gpu-packages.sh
          bash scripts/linux/tests/test-profile-parity-mutations.sh
          bash scripts/linux/tests/test-check-gpu-detector-parity.sh
          python3 -I "$parity_tests"
          python3 scripts/linux/tests/test-detector-parity.py
          python3 scripts/linux/tests/test-amd-gpu-promotion.py
          bash scripts/linux/tests/test-gpu-clean-host-env.sh
          python3 scripts/windows/tests/test_gpu_workflow.py
      - name: Select the AMD image
        id: image
        shell: bash
        run: |
          cpu_image="$(bash third_party/ANTfrastructure/linux/scripts/ci-image-ref.sh --linux)"
          printf 'ref=%s:latest-rocm\n' "${cpu_image%:*}" >> "$GITHUB_OUTPUT"
      - name: Prepare disk and pull the GPU image
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@develop
        with:
          image: ${{ steps.image.outputs.ref }}
          checkout: 'false'
          free-disk-space: 'true'
          pull-first: 'false'
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}
      - name: Compute version
        run: bash scripts/linux/compute-version.sh
      - name: Build, test and package
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          docker run --rm --user root --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            -e VERSION -e CARGO_HOME=/tmp/cargo-home -e CARGO_TERM_COLOR=always \
            "$IMAGE" bash -c '
              set -euo pipefail
              hub=third_party/ANTfrastructure/linux/scripts/06-packaging
              ort=/usr/local/lib/onnxruntime-gpu/lib
              mkdir -p /tmp/oxidant-ort-preflight
              python3 "$hub/stage-ort-wheel-licenses.py" --require-unstripped \
                --strip "${STRIP:-strip}" \
                --wheel-dir /opt/onnxruntime-wheels --destination /tmp/oxidant-ort-preflight \
                --library "$ort/libonnxruntime.so.1" \
                --library "$ort/libonnxruntime_providers_shared.so" \
                --library "$ort/libonnxruntime_providers_migraphx.so"
              mkdir -p "$CARGO_HOME"
              chown 1001:1001 "$CARGO_HOME"
              runuser -u kataglyphis -- bash -c '\''
                set -euo pipefail
                cargo test --locked -p kataglyphis_inference --lib device_tests
                cargo test --locked -p kataglyphis_inference --test gpu_request
                python3 scripts/linux/tests/test-ort-gpu-profile.py
                cargo build --locked --release -p kataglyphis_cli
                KATAGLYPHIS_PACKAGING_WORKDIR=/tmp/oxidant-gpu-package-work \
                bash scripts/linux/package-linux.sh --binary-path target/release/kataglyphis_cli \
                  --version "$VERSION" --arch x64 --platform linux/amd64 \
                  --package-types tar,deb,appimage --ort-variant amd
                profile_dir="$(mktemp -d)"
                env -u KATAGLYPHIS_ONNX_MODEL ORT_DYLIB_PATH=/tmp/oxidant-gpu-package-work/oxidant/lib/libonnxruntime.so \
                KATAGLYPHIS_ORT_DEVICE=cpu /tmp/oxidant-gpu-package-work/oxidant/oxidant \
                  onnx-check --profile "$profile_dir/profile"
                mapfile -t profiles < <(find "$profile_dir" -maxdepth 1 -type f -name "profile*.json")
                [[ ${#profiles[@]} -eq 1 ]]
                python3 scripts/verify-ort-gpu-profile.py "${profiles[0]}" --device cpu
                if python3 scripts/verify-ort-gpu-profile.py "${profiles[0]}" --device migraphx; then
                  echo "CPU-only profile was accepted as GPU execution" >&2
                  exit 1
                fi
                bash scripts/linux/verify-gpu-packages.sh dist x64 amd
              '\''
            '
      - name: Name the candidate
        id: name
        run: |
          printf 'artifact_prefix=oxidant-%s-linux-x64-amd-host-runtime-candidate\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'producer_attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Select the exact promotion packages
        if: ${{ inputs.promote-verified }}
        id: promotion_files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(dist/*.deb)
          tarballs=(dist/*.tar.gz)
          appimages=(dist/*.AppImage)
          [[ ${#debs[@]} -eq 1 && ${#tarballs[@]} -eq 1 && ${#appimages[@]} -eq 1 ]] || { echo 'Expected exactly one DEB, tarball and AppImage' >&2; exit 1; }
          for file in "${debs[0]}" "${tarballs[0]}" "${appimages[0]}"; do
            [[ "$file" != *$'\n'* && "$file" != *$'\r'* ]] || { echo 'Invalid package filename' >&2; exit 1; }
          done
          {
            echo 'files<<OXIDANT_PACKAGE_FILES'
            printf '%s\n' "${debs[0]##*/}" "${tarballs[0]##*/}" "${appimages[0]##*/}"
            echo 'OXIDANT_PACKAGE_FILES'
          } >> "$GITHUB_OUTPUT"
      - name: Upload package candidate
        if: ${{ !inputs.promote-verified }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ format('{0}-attempt-{1}{2}', steps.name.outputs.artifact_prefix, github.run_attempt, needs.scope.outputs.suffix) }}
          overwrite: false
          if-no-files-found: error
          path: dist/**
      - name: Upload exact unverified promotion input
        if: ${{ inputs.promote-verified }}
        id: promotion_upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ format('{0}-attempt-{1}{2}', steps.name.outputs.artifact_prefix, github.run_attempt, needs.scope.outputs.suffix) }}
          overwrite: false
          if-no-files-found: error
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/*.AppImage

  clean-host:
    name: CPU inference and missing AMD runtime on clean Ubuntu
    needs: [scope, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Require a candidate from this attempt
        if: ${{ inputs.promote-verified }}
        env:
          PRODUCER_ATTEMPT: ${{ needs.build.outputs.producer_attempt }}
        run: test "$PRODUCER_ATTEMPT" = "$GITHUB_RUN_ATTEMPT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the missing-runtime check
        run: bash scripts/linux/tests/test-check-missing-gpu-runtime.sh
      - name: Install, unpack, and run packaged CPU inference
        if: ${{ !inputs.promote-verified }}
        uses: Kataglyphis/ANTfrastructure/.github/actions/clean-host-package-check@develop
        with:
          artifact: ${{ format('{0}-attempt-{1}{2}', needs.build.outputs.artifact_prefix, github.run_attempt, needs.scope.outputs.suffix) }}
          scan-elves: 'false'
          deb: '*.deb'
          deb-command: env -u KATAGLYPHIS_ONNX_MODEL KATAGLYPHIS_ORT_DEVICE=cpu oxidant onnx-check && oxidant media-check && bash "$GITHUB_WORKSPACE/scripts/linux/check-missing-gpu-runtime.sh" amd oxidant
          tarball: '*.tar.gz'
          tarball-command: env -u KATAGLYPHIS_ONNX_MODEL KATAGLYPHIS_ORT_DEVICE=cpu ./oxidant onnx-check && ./oxidant media-check && bash "$GITHUB_WORKSPACE/scripts/linux/check-missing-gpu-runtime.sh" amd ./oxidant
          appimage: '*.AppImage'
          appimage-command: env -u KATAGLYPHIS_ONNX_MODEL KATAGLYPHIS_ORT_DEVICE=cpu "$APPIMAGE" onnx-check && "$APPIMAGE" media-check && bash "$GITHUB_WORKSPACE/scripts/linux/check-missing-gpu-runtime.sh" amd "$APPIMAGE"
      - name: Check immutable packages with isolated CPU inference
        if: ${{ inputs.promote-verified }}
        uses: Kataglyphis/ANTfrastructure/.github/actions/clean-host-package-check@da0bdf709f491b900a9ed02c821d7cbc3a13c8be
        with:
          artifact: ${{ format('{0}-attempt-{1}{2}', needs.build.outputs.artifact_prefix, github.run_attempt, needs.scope.outputs.suffix) }}
          scan-elves: 'false'
          deb: '*.deb'
          deb-command: bash "$GITHUB_WORKSPACE/scripts/linux/check-gpu-clean-host.sh" amd oxidant
          tarball: '*.tar.gz'
          tarball-command: bash "$GITHUB_WORKSPACE/scripts/linux/check-gpu-clean-host.sh" amd ./oxidant
          appimage: '*.AppImage'
          appimage-command: bash "$GITHUB_WORKSPACE/scripts/linux/check-gpu-clean-host.sh" amd "$APPIMAGE"
          artifact-id: ${{ inputs.promote-verified && needs.build.outputs.artifact_id || '' }}
          artifact-digest: ${{ inputs.promote-verified && needs.build.outputs.artifact_digest || '' }}
          artifact-files: ${{ inputs.promote-verified && needs.build.outputs.artifact_files || '' }}
          gpu-vendor: ${{ inputs.promote-verified && 'amd' || '' }}
          gpu-arch: ${{ inputs.promote-verified && 'x64' || '' }}
          gpu-receipt: ${{ inputs.promote-verified && format('{0}/oxidant-amd-clean-receipt.json', runner.temp) || '' }}
          max-uncompressed-bytes: ${{ inputs.promote-verified && '42949672960' || '' }}
          max-compression-ratio: ${{ inputs.promote-verified && '1000' || '' }}
      - name: Upload the clean-host receipt
        if: ${{ inputs.promote-verified }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unverified-oxidant-amd-clean-receipt-${{ github.run_id }}-attempt-${{ github.run_attempt }}${{ needs.scope.outputs.suffix }}
          path: ${{ runner.temp }}/oxidant-amd-clean-receipt.json
          overwrite: false
          if-no-files-found: error
      # Only reached when this job's checks passed; release.yml collects this name.
      - name: Download the checked GPU packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ format('{0}-attempt-{1}{2}', needs.build.outputs.artifact_prefix, github.run_attempt, needs.scope.outputs.suffix) }}
          path: ${{ runner.temp }}/gpu-release-packages
      - name: Upload the checked GPU packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oxidant-gpu-amd-linux-x64${{ needs.scope.outputs.suffix }}
          overwrite: true
          if-no-files-found: error
          path: ${{ runner.temp }}/gpu-release-packages/*

  gpu-profile:
    if: ${{ inputs.verify-gpu }}
    needs: [scope, build, clean-host]
    runs-on: [self-hosted, Linux, X64, gpu-amd-rocm]
    timeout-minutes: 30
    steps:
      - name: Require a candidate from this attempt
        if: ${{ inputs.promote-verified }}
        env:
          PRODUCER_ATTEMPT: ${{ needs.build.outputs.producer_attempt }}
        run: test "$PRODUCER_ATTEMPT" = "$GITHUB_RUN_ATTEMPT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ !inputs.promote-verified }}
        with:
          name: ${{ format('{0}-attempt-{1}{2}', needs.build.outputs.artifact_prefix, github.run_attempt, needs.scope.outputs.suffix) }}
          path: ${{ runner.temp }}/oxidant-amd-${{ github.run_id }}-${{ github.run_attempt }}${{ needs.scope.outputs.suffix }}
      - name: Require model operators on MIGraphX from every package
        if: ${{ !inputs.promote-verified }}
        shell: bash
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/oxidant-amd-${{ github.run_id }}-${{ github.run_attempt }}${{ needs.scope.outputs.suffix }}
        run: |
          bash scripts/linux/profile-gpu-packages.sh "$CANDIDATE_DIR" migraphx
      - name: Profile immutable AMD packages and record their bytes
        if: ${{ inputs.promote-verified }}
        uses: Kataglyphis/ANTfrastructure/.github/actions/gpu-package-check@da0bdf709f491b900a9ed02c821d7cbc3a13c8be
        with:
          artifact-id: ${{ needs.build.outputs.artifact_id }}
          artifact-digest: ${{ needs.build.outputs.artifact_digest }}
          artifact-files: ${{ needs.build.outputs.artifact_files }}
          gpu-vendor: amd
          gpu-arch: x64
          gpu-receipt: ${{ runner.temp }}/oxidant-amd-${{ github.run_id }}-${{ github.run_attempt }}${{ needs.scope.outputs.suffix }}-gpu-receipt.json
          max-uncompressed-bytes: '42949672960'
          max-compression-ratio: '1000'
          command: env ANTFRASTRUCTURE_DIR="$GITHUB_WORKSPACE/third_party/ANTfrastructure" bash scripts/linux/profile-gpu-packages.sh "$GPU_PACKAGE_DIR" migraphx "$GITHUB_WORKSPACE/crates/inference/tests/fixtures/two_cats.jpg"
      - name: Upload the GPU profile receipt
        if: ${{ inputs.promote-verified }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unverified-oxidant-amd-gpu-receipt-${{ github.run_id }}-attempt-${{ github.run_attempt }}${{ needs.scope.outputs.suffix }}
          path: ${{ runner.temp }}/oxidant-amd-${{ github.run_id }}-${{ github.run_attempt }}${{ needs.scope.outputs.suffix }}-gpu-receipt.json
          overwrite: false
          if-no-files-found: error

  stage-verified:
    if: ${{ inputs.promote-verified && inputs.verify-gpu }}
    needs: [scope, build, clean-host, gpu-profile]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Require a candidate from this attempt
        env:
          PRODUCER_ATTEMPT: ${{ needs.build.outputs.producer_attempt }}
        run: test "$PRODUCER_ATTEMPT" = "$GITHUB_RUN_ATTEMPT"
      - name: Download immutable candidate archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/oxidant-amd-promotion-archive
          skip-decompress: true
          digest-mismatch: error
      - name: Select the downloaded archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' archives < <(find "$RUNNER_TEMP/oxidant-amd-promotion-archive" -mindepth 1 -maxdepth 1 -type f -print0)
          [[ ${#archives[@]} -eq 1 && "${archives[0]}" != *$'\n'* && "${archives[0]}" != *$'\r'* ]] || { echo 'Expected exactly one artifact archive' >&2; exit 1; }
          printf 'path=%s\n' "${archives[0]}" >> "$GITHUB_OUTPUT"
      - name: Download clean-host receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unverified-oxidant-amd-clean-receipt-${{ github.run_id }}-attempt-${{ github.run_attempt }}${{ needs.scope.outputs.suffix }}
          path: ${{ runner.temp }}/oxidant-amd-clean-receipt
          digest-mismatch: error
      - name: Download GPU profile receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unverified-oxidant-amd-gpu-receipt-${{ github.run_id }}-attempt-${{ github.run_attempt }}${{ needs.scope.outputs.suffix }}
          path: ${{ runner.temp }}/oxidant-amd-gpu-receipt
          digest-mismatch: error
      - name: Stage the exact checked packages
        uses: Kataglyphis/ANTfrastructure/.github/actions/stage-gpu-artifact@da0bdf709f491b900a9ed02c821d7cbc3a13c8be
        with:
          archive: ${{ steps.archive.outputs.path }}
          clean-receipt: ${{ runner.temp }}/oxidant-amd-clean-receipt/oxidant-amd-clean-receipt.json
          gpu-receipt: ${{ runner.temp }}/oxidant-amd-gpu-receipt/oxidant-amd-${{ github.run_id }}-${{ github.run_attempt }}${{ needs.scope.outputs.suffix }}-gpu-receipt.json
          output: ${{ runner.temp }}/oxidant-amd-verified-packages
          artifact-id: ${{ needs.build.outputs.artifact_id }}
          artifact-digest: ${{ needs.build.outputs.artifact_digest }}
          artifact-files: ${{ needs.build.outputs.artifact_files }}
          gpu-platform: linux
          gpu-vendor: amd
          gpu-arch: x64
          max-uncompressed-bytes: '42949672960'
          max-compression-ratio: '1000'
      - name: Upload the checked AMD packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-oxidant-linux-x64-amd-${{ github.run_id }}-attempt-${{ github.run_attempt }}${{ needs.scope.outputs.suffix }}
          path: ${{ runner.temp }}/oxidant-amd-verified-packages/*
          overwrite: false
          if-no-files-found: error
