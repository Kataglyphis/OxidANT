# Every push to main is a release: every lane once more on that commit, then v<version> only when all are green (third_party/ANTfrastructure/docs/branch-and-release-strategy.md).
name: Release · every lane, then v<version>

on:
  push:
    branches: ["main"]
  # Starts the release again on main's newest commit when the pushed run can no longer be rerun.
  workflow_dispatch:

permissions: {}

# Never two releases at once, and never a cancelled one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # A minute, so a merge without a new version stops before hours of lanes; a dispatch on another branch releases nothing.
  version:
    name: Version not released yet
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Only the hub, for its release script; the vendored libraries stay out.
      - name: Fetch the hub
        run: git submodule update --init --depth 1 third_party/ANTfrastructure

      - name: Cargo.toml's version has a CHANGELOG section and no release yet
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          bash third_party/ANTfrastructure/linux/scripts/06-packaging/publish-github-release.sh
          --version-file Cargo.toml --changelog CHANGELOG.md --name OxidANT --check

  # The lanes on-request.yml calls, plus linux-x64; each grants what its lane's jobs ask for.
  linux-x64:
    needs: version
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/linux-x64.yml
    secrets: inherit

  linux-arm64:
    needs: version
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/linux-arm64.yml
    secrets: inherit

  linux-riscv64:
    needs: version
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/linux-riscv64.yml
    secrets: inherit

  windows-x64:
    needs: version
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/windows-x64.yml
    secrets: inherit

  windows-arm64-cross:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/windows-arm64-cross.yml
    secrets: inherit

  # needs: every lane, so one red or cancelled lane means no tag and no release.
  release:
    name: Tag and publish the release
    needs: [linux-x64, linux-arm64, linux-riscv64, windows-x64, windows-arm64-cross]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch the hub
        run: git submodule update --init --depth 1 third_party/ANTfrastructure

      - name: Download every lane's uploads
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Collect the packages
        run: bash scripts/linux/collect-release-assets.sh artifacts release "$(bash third_party/ANTfrastructure/linux/scripts/02-toolchain/rust/version_util.sh --file-version Cargo.toml)"

      - name: Tag v<version> and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          bash third_party/ANTfrastructure/linux/scripts/06-packaging/publish-github-release.sh
          --version-file Cargo.toml --changelog CHANGELOG.md --name OxidANT --assets release
