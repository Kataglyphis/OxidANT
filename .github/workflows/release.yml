# Every push to main is a release: every lane once more on that commit, then v<version> only when all are green (third_party/ANTfrastructure/docs/branch-and-release-strategy.md).
name: Release · every lane, then v<version>

on:
  push:
    branches: ["main"]
  # On main: the release again, when the pushed run can no longer be rerun. Elsewhere: a dry run.
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run every lane and collect the release files on this branch, but tag and publish nothing
        type: boolean
        default: false

permissions: {}

# Never two releases at once, and never a cancelled one; a dry run on develop does not hold up main's.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A minute, so a merge without a new version stops before hours of lanes; elsewhere only a dry run runs.
  version:
    if: github.ref == 'refs/heads/main' || inputs.dry-run
    # The grant covers the called file's publish job too; the check itself reads only.
    permissions:
      contents: write
    uses: Kataglyphis/ANTfrastructure/.github/workflows/release-publish.yml@develop
    with:
      stage: check
      name: OxidANT
      version-file: Cargo.toml
      dry-run: ${{ inputs.dry-run == true }}

  # The lanes on-request.yml calls, plus linux-x64; each grants what its lane's jobs ask for.
  linux-x64:
    needs: version
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/linux-x64.yml
    secrets: inherit

  linux-arm64:
    needs: version
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/linux-arm64.yml
    secrets: inherit

  linux-riscv64:
    needs: version
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/linux-riscv64.yml
    secrets: inherit

  windows-x64:
    needs: version
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/windows-x64.yml
    secrets: inherit

  windows-arm64-cross:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/windows-arm64-cross.yml
    secrets: inherit

  # needs: every lane, so one red or cancelled lane means no tag and no release.
  release:
    needs: [linux-x64, linux-arm64, linux-riscv64, windows-x64, windows-arm64-cross]
    permissions:
      contents: write
    uses: Kataglyphis/ANTfrastructure/.github/workflows/release-publish.yml@develop
    with:
      stage: publish
      name: OxidANT
      version-file: Cargo.toml
      dry-run: ${{ inputs.dry-run == true }}
      # Every package by extension, each flatpak named for its arch, the portable Windows folder zipped.
      collect: |
        --include *.msix
        --include *.msi
        --include *.AppImage
        --include *.deb
        --include *.tar.gz
        --zip kataglyphis_cli-windows-*/bundle=kataglyphis_cli-{version}-windows-{arch}.zip
        --flatpak-arch-from-suffix
        --skip *-tests
        --skip *-test-results
