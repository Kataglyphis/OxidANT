# The web demo in headless Chrome: every render mode drawn on SwiftShader's WebGPU, read back and checked (docs/testing.md).
name: Web demo · browser draw

# On request ([ci web], [ci browser]) and by hand: a release wasm build plus about ten minutes of SwiftShader.
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      GHCR_PAT:
        required: false

# Nothing here writes through GITHUB_TOKEN but the cache save; the GHCR pull uses its own secret.
permissions:
  contents: read

concurrency:
  group: web-browser-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  draw:
    name: Web demo in headless Chrome (x64)
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
      # compiler-cache-save deletes this key's older cache entries.
      actions: write
    steps:
      - name: Prepare the CI host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@develop
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}

      - name: Restore the cargo and compiler cache
        id: cc
        uses: Kataglyphis/ANTfrastructure/.github/actions/compiler-cache-restore@develop
        with:
          key: x64-wasm
          mounts: 'cargo-home:/tmp/cargo-home sccache:/var/cache/sccache'
          env: 'SCCACHE_CACHE_SIZE=1500M RUSTC_WRAPPER=/workspace/third_party/ANTfrastructure/linux/scripts/01-core/sccache-launcher.sh'

      - name: Draw every mode in headless Chrome
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: --platform linux/amd64 -e CARGO_HOME=/tmp/cargo-home -e CARGO_TERM_COLOR=always ${{ steps.cc.outputs.docker-args }}
          script: bash -lc 'bash scripts/linux/ci-container-steps.sh web-browser --frames logs/web-browser'

      - name: Upload the read-back frames
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-browser-frames
          if-no-files-found: error
          path: logs/web-browser/*.png

      - name: Trim the cargo home
        if: always() && steps.cc.outputs.path != ''
        env:
          CACHE_PATH: ${{ steps.cc.outputs.path }}
        run: rm -rf "${CACHE_PATH}/cargo-home/registry/src" "${CACHE_PATH}/cargo-home/git/checkouts"

      - name: Save the cargo and compiler cache
        if: always() && steps.cc.outputs.path != ''
        uses: Kataglyphis/ANTfrastructure/.github/actions/compiler-cache-save@develop
        with:
          key: x64-wasm
