# Both Linux lanes' steps; no `concurrency:` here, since github.workflow is the caller's name and a group would deadlock.
name: Linux · reusable build

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          GitHub-hosted runner label - ubuntu-26.04 or ubuntu-26.04-arm. Both
          architectures build natively; nothing here runs under QEMU.
        type: string
        required: true
      platform:
        description: Container --platform, linux/amd64 or linux/arm64.
        type: string
        required: true
      arch:
        description: package_archive.sh --arch (x64 or arm64), and the job name.
        type: string
        required: true
      artifact-suffix:
        description: Middle of the uploaded artifact's name, e.g. ubuntu-26.04-x64.
        type: string
        required: true
    # Optional for fork PRs: the image is public. The docs site is docs.yml's.
    secrets:
      GHCR_PAT:
        required: false

# The GHCR pull uses its own secret, never GITHUB_TOKEN.
permissions:
  contents: read

# No image ref here: omitting the actions' `image:` input takes the family image from versions.env.
env:
  CARGO_TERM_COLOR: always
  # CARGO_HOME on the cache mount (`cargo-home:/tmp/cargo-home` below), so the registry outlives each step's container.
  CONTAINER_ENV: -e CARGO_HOME=/tmp/cargo-home -e CARGO_TERM_COLOR=always

jobs:
  build:
    name: Build, test, package (${{ inputs.arch }})
    runs-on: ${{ inputs.runner }}
    # Room for twice a normal run plus a cold image pull.
    timeout-minutes: 90
    permissions:
      contents: read
      # compiler-cache-save deletes this key's older cache entries.
      actions: write
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
    env:
      PLATFORM: ${{ inputs.platform }}
      ARCH: ${{ inputs.arch }}
      BINARY: oxidant
      BINARY_FILE: kataglyphis_cli
      # VERSION is computed by scripts/linux/compute-version.sh into GITHUB_ENV.
      REF_NAME: ${{ github.ref_name }}
      RUN_NUMBER: ${{ github.run_number }}
      # Each format scripts/linux/package-linux.sh packs from the one bundle.
      PACKAGE_TYPES: tar,deb,appimage,flatpak
    steps:
      - name: Prepare the CI host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@develop
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}

      - name: Compute version
        id: compute-version
        shell: bash
        run: bash scripts/linux/compute-version.sh

      # CARGO_HOME and sccache outlive the per-step containers; the launcher compiles directly if sccache fails.
      - name: Restore the cargo and compiler cache
        id: cc
        uses: Kataglyphis/ANTfrastructure/.github/actions/compiler-cache-restore@develop
        with:
          key: ${{ inputs.arch }}-cargo
          mounts: 'cargo-home:/tmp/cargo-home sccache:/var/cache/sccache'
          env: 'SCCACHE_CACHE_SIZE=1500M RUSTC_WRAPPER=/workspace/third_party/ANTfrastructure/linux/scripts/01-core/sccache-launcher.sh'

      # Each container step below reproduces by hand as `bash scripts/linux/ci-container-steps.sh <step>` in the family image.

      # Gating: ONNX Runtime must come from the chain build, never pyke's CDN or pkg-config.
      - name: ONNX Runtime chain-only check
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: --platform ${{ env.PLATFORM }} ${{ env.CONTAINER_ENV }} ${{ steps.cc.outputs.docker-args }}
          script: bash -lc 'bash scripts/linux/ci-container-steps.sh ort-chain-only'

      - name: Debug build
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: --platform ${{ env.PLATFORM }} ${{ env.CONTAINER_ENV }} ${{ steps.cc.outputs.docker-args }}
          script: bash -lc 'bash scripts/linux/ci-container-steps.sh debug'

      # Gating: .cargo/audit.toml and deny.toml's [advisories].ignore must agree.
      - name: Security checks (cargo audit + cargo deny)
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: --platform ${{ env.PLATFORM }} ${{ env.CONTAINER_ENV }} ${{ steps.cc.outputs.docker-args }}
          script: bash -lc 'bash scripts/linux/ci-container-steps.sh security'

      # Gating, never continue-on-error.
      - name: Check formatting and clippy
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: --platform ${{ env.PLATFORM }} ${{ env.CONTAINER_ENV }} ${{ steps.cc.outputs.docker-args }}
          script: bash -lc 'bash scripts/linux/ci-container-steps.sh fmt-clippy'

      - name: Run unit, integration, and doc tests
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: --platform ${{ env.PLATFORM }} ${{ env.CONTAINER_ENV }} ${{ steps.cc.outputs.docker-args }}
          script: bash -lc 'bash scripts/linux/ci-container-steps.sh test'

      - name: Run coverage
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: --platform ${{ env.PLATFORM }} ${{ env.CONTAINER_ENV }} ${{ steps.cc.outputs.docker-args }}
          script: bash -lc 'bash scripts/linux/ci-container-steps.sh coverage'

      # The means of the default branch's last 20 runs per arch; their median is the yardstick, not the run before.
      - name: Restore the benchmark history
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bench-history
          key: bench-history-${{ runner.arch }}-${{ github.sha }}
          restore-keys: bench-history-${{ runner.arch }}-

      - name: Run benchmarks
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: --platform ${{ env.PLATFORM }} ${{ env.CONTAINER_ENV }} ${{ steps.cc.outputs.docker-args }}
          script: bash -lc 'bash scripts/linux/ci-container-steps.sh bench'

      - name: Benchmark report
        if: always()
        run: python3 scripts/linux/bench-report.py target/criterion .bench-history --write bench-means.json >> "$GITHUB_STEP_SUMMARY"

      # Not always(): a run the report failed must not pull the median towards its own slowdown.
      - name: Add this run to the benchmark history
        id: bench-history
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && hashFiles('bench-means.json') != ''
        run: |
          mkdir -p .bench-history
          cp bench-means.json ".bench-history/$(printf '%08d' "$GITHUB_RUN_NUMBER")-${GITHUB_SHA::7}.json"
          find .bench-history -name '*.json' | sort | head -n -20 | xargs -r rm -f

      - name: Keep the benchmark history
        if: steps.bench-history.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bench-history
          key: bench-history-${{ runner.arch }}-${{ github.sha }}

      - name: 🛠️ Build release binary
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: --platform ${{ env.PLATFORM }} ${{ env.CONTAINER_ENV }} ${{ steps.cc.outputs.docker-args }}
          script: bash -lc 'bash scripts/linux/ci-container-steps.sh release'

      # --privileged: flatpak-builder runs its build under bubblewrap. The CLI travels with its GStreamer, ORT, model and glibc.
      - name: 📦 Create packages (tar, deb, AppImage, flatpak)
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: >-
            --privileged --platform ${{ env.PLATFORM }} ${{ env.CONTAINER_ENV }} ${{ steps.cc.outputs.docker-args }}
            -e BINARY="${{ env.BINARY }}"
            -e BINARY_FILE="${{ env.BINARY_FILE }}"
            -e VERSION="${{ env.VERSION }}"
            -e PACKAGE_TYPES="${{ env.PACKAGE_TYPES }}"
            -e PLATFORM="${{ env.PLATFORM }}"
            -e ARCH="${{ env.ARCH }}"
            -e APP_PACKAGING_APP_ID_PREFIX=org.kataglyphis
            -e APP_PACKAGING_MAINTAINER="Kataglyphis <dev@kataglyphis.local>"
            -e APP_PACKAGING_DESCRIPTION="OxidANT, the Kataglyphis Rust tooling."
          script: >-
            bash -lc 'set -e;
            git config --global --add safe.directory /workspace || true;
            bash scripts/linux/package-linux.sh
            --binary "${BINARY}"
            --binary-path "target/release/${BINARY_FILE}"
            --version "${VERSION}"
            --package-types "${PACKAGE_TYPES}"
            --platform "${PLATFORM}"
            --arch "${ARCH}"'

      # Named by VERSION: a PR's ref_name is `<n>/merge` and upload-artifact refuses the `/`.
      - name: Name the artifact
        id: artifact
        if: always()
        run: echo "name=${BINARY}-${VERSION}-${{ inputs.artifact-suffix }}-all" >> "$GITHUB_OUTPUT"

      - name: Upload all artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          # This also runs after a failed build, which must not look delivered.
          if-no-files-found: error
          path: |
            tarpaulin-report.html
            tarpaulin-report.xml
            target/release/${{ env.BINARY_FILE }}
            dist/**

      # registry/src and git checkouts re-extract from registry/cache in seconds, so they stay out of the archive.
      - name: Trim the cargo home
        if: always() && steps.cc.outputs.path != ''
        env:
          CACHE_PATH: ${{ steps.cc.outputs.path }}
        run: rm -rf "${CACHE_PATH}/cargo-home/registry/src" "${CACHE_PATH}/cargo-home/git/checkouts"

      - name: Save the cargo and compiler cache
        if: always() && steps.cc.outputs.path != ''
        uses: Kataglyphis/ANTfrastructure/.github/actions/compiler-cache-save@develop
        with:
          key: ${{ inputs.arch }}-cargo

  # Inside the image every library is present; only a bare host shows one the packages lack (hub linux-build-basics.md).
  clean-host:
    name: Packages on a clean Ubuntu 26.04 (${{ inputs.arch }})
    needs: build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Install, unpack and start the .deb, the tarball and the AppImage
        uses: Kataglyphis/ANTfrastructure/.github/actions/clean-host-package-check@develop
        with:
          artifact: ${{ needs.build.outputs.artifact }}
          subdir: dist
          deb: '*.deb'
          deb-command: oxidant --help && oxidant onnx-runtime && oxidant media-check
          tarball: '*.tar.gz'
          tarball-command: ./oxidant --help && ./oxidant onnx-runtime && ./oxidant media-check
          appimage: '*.AppImage'
          appimage-command: '"$APPIMAGE" onnx-runtime && "$APPIMAGE" media-check'
