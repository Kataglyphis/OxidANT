# .github/workflows/reusable-linux.yml
#
# THE LINUX LANE, WRITTEN ONCE FOR BOTH ARCHITECTURES. linux-x64.yml and
# linux-arm64.yml are thin callers: each says WHEN it runs and WHICH runner,
# container platform and artifact suffix it wants, and this file says HOW. Every
# step is shared, so an arch-specific copy of any of them would be a second
# place to edit and a second chance to drift.
#
# Until 2026-09-24 this was one workflow, rust_ubuntu26_04.yml, whose arm64 row
# only ran with `[build-arm]` in the HEAD commit message. The owner asked for
# every platform lane on every push and PR, and the family naming convention
# is one kebab-case file per platform + arch, so the matrix became two callers
# of this file. Neither caller carries an `if:`; that is what "always runs"
# rests on.
#
# NO `concurrency:` HERE, DELIBERATELY. Inside a called workflow
# `github.workflow` is the CALLER's name, so a group here would repeat the
# caller's own and GitHub cancels the run as a concurrency deadlock. Each caller
# owns its group, one per workflow.
name: Linux · reusable build

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          GitHub-hosted runner label - ubuntu-26.04 or ubuntu-26.04-arm. Both
          architectures build natively; nothing here runs under QEMU.
        type: string
        required: true
      platform:
        description: Container --platform, linux/amd64 or linux/arm64.
        type: string
        required: true
      arch:
        description: package_archive.sh --arch (x64 or arm64), and the job name.
        type: string
        required: true
      artifact-suffix:
        description: Middle of the uploaded artifact's name, e.g. ubuntu-26.04-x64.
        type: string
        required: true
      docs:
        description: >-
          Build rustdoc and, on a push to the default branch, publish it. Exactly
          one caller sets this: the site is one site, not one per architecture.
        type: boolean
        default: false
    # All four optional, because a fork PR has none of them:
    # prepare-linux-ci-host skips the registry login on an empty password (the
    # image is public) and the FTP publish never runs on a pull_request.
    secrets:
      GHCR_PAT:
        required: false
      SERVER:
        required: false
      USERNAME:
        required: false
      PW:
        required: false

# Nothing in this workflow writes to the repository. The GHCR pull and the
# docs publish authenticate with their own secrets, never with GITHUB_TOKEN,
# so the default (often write) token permissions are pure attack surface.
permissions:
  contents: read

# NO CONTAINER_IMAGE HERE, DELIBERATELY. This workflow opened with a
# `CONTAINER_IMAGE:` holding the full image reference and handed it to all
# twelve container steps below. It called itself the "single source of truth"
# for the build image and was the opposite: a COPY of a value ANTfrastructure
# already owns (versions.env's IMAGE_REGISTRY_PREFIX + CI_IMAGE_LINUX_TAG), so
# a fleet-wide tag bump landed everywhere except here. The ref is not repeated
# in this comment either - a literal in a comment rots the same way, and
# verify_ci_image_refs.py check D reads comments too.
#
# Both container actions declare that composed ref as their `image:` input
# DEFAULT, so OMITTING the input is how a lane says "the family image"; check A
# of that same gate fails ANTfrastructure's own build if a default and versions.env
# ever disagree. This is exactly the route the actions' input docs prescribe
# ("SINGLE SOURCE OF TRUTH: omit this input").
env:
  CARGO_TERM_COLOR: always
  # The image ships CARGO_HOME=/usr/local/cargo owned by root while the
  # container runs as uid 1001. Every cargo step that WRITES (registry cache,
  # `cargo install`, tarpaulin, rustdoc) dies with "Permission denied" unless
  # CARGO_HOME points somewhere the uid owns. ANTfrastructure's cargo scripts
  # carry a guard for this, but setting it here covers the direct cargo
  # invocations below too - one place instead of six.
  CONTAINER_ENV: -e CARGO_HOME=/tmp/cargo-home -e CARGO_TERM_COLOR=always

jobs:
  build:
    name: Build, test, package (${{ inputs.arch }})
    runs-on: ${{ inputs.runner }}
    # About 35 minutes on x64 (the 2026-09-22 and 2026-09-23 runs); arm64 runs
    # the same steps natively. Room for twice that plus a cold image pull, and
    # far short of the six-hour account default a hung step would burn.
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      PLATFORM: ${{ inputs.platform }}
      ARCH: ${{ inputs.arch }}
      BINARY: oxidant
      BINARY_FILE: kataglyphis_cli
      # VERSION is computed by scripts/linux/compute-version.sh into GITHUB_ENV.
      REF_NAME: ${{ github.ref_name }}
      RUN_NUMBER: ${{ github.run_number }}
      # package_archive.sh only writes a tarball; PACKAGE_TYPES merely gates whether
      # --flatpak-manifest is demanded. Naming formats it cannot build made the step
      # claim four artifacts and upload one. See BACKLOG.md.
      PACKAGE_TYPES: tar
    steps:
      # Free disk, checkout (recursive), registry login and a retried image
      # pull - four steps that used to be ~35 hand-maintained lines here, and
      # drifted from the sibling Windows lane. Now one shared action.
      - name: Prepare the CI host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@main
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}

      - name: Compute version
        id: compute-version
        shell: bash
        run: bash scripts/linux/compute-version.sh

      # EVERY CONTAINER STEP BELOW IS ONE NAMED STEP OF ONE SCRIPT,
      # scripts/linux/ci-container-steps.sh. Each of them used to inline its
      # own `bash -lc 'set -e; git config --global --add safe.directory ...;
      # bash third_party/.../cargo_<x>.sh'` - the same prologue eight times,
      # eight places to edit, and nothing a human could run without retyping
      # a container command out of YAML. The script IS the reproduction:
      #   bash scripts/linux/ci-container-steps.sh <step>
      # inside the family Linux image. Every step delegates to ANTfrastructure's
      # cargo_*.sh drivers - including `fmt-clippy`, which hand-rolled its two
      # cargo calls until the driver grew a CARGO_CLIPPY_ARGS knob.
      # GATING. The family owner rule (2026-09-23): ONNX Runtime is the chain
      # build only. Fails if any feature set could download ORT (pyke's CDN) or
      # take a pkg-config one - lock and resolved feature graph, all targets.
      - name: ONNX Runtime chain-only check
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          extra-args: --platform ${{ env.PLATFORM }} ${{ env.CONTAINER_ENV }}
          script: bash -lc 'bash scripts/linux/ci-container-steps.sh ort-chain-only'

      - name: Debug build
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          extra-args: --platform ${{ env.PLATFORM }} ${{ env.CONTAINER_ENV }}
          script: bash -lc 'bash scripts/linux/ci-container-steps.sh debug'

      # GATING, and the gate that was red on 2026-09-14. It reads two ignore
      # lists that must agree: .cargo/audit.toml and deny.toml's
      # [advisories].ignore. While this step fails, the docs publish at the
      # end of this job never runs.
      - name: Security checks (cargo audit + cargo deny)
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          extra-args: --platform ${{ env.PLATFORM }} ${{ env.CONTAINER_ENV }}
          script: bash -lc 'bash scripts/linux/ci-container-steps.sh security'

      # GATING, with no continue-on-error. It was `continue-on-error: true`
      # for months and exited 127 every time - the driver it called opened
      # with `rustup component add rustfmt` on an image that ships no rustup -
      # so an entire crate (crates/webgpu_renderer) reached the default branch
      # unformatted and with 12 clippy errors. It runs ANTfrastructure's
      # cargo_fmt_clippy.sh now, with CARGO_CLIPPY_ARGS='--workspace --locked'
      # set in the `fmt-clippy` case of scripts/linux/ci-container-steps.sh:
      # --all-features is what this image cannot build, and it is a knob rather
      # than a hard-coded scope since the pinned hub.
      - name: Check formatting and clippy
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          extra-args: --platform ${{ env.PLATFORM }} ${{ env.CONTAINER_ENV }}
          script: bash -lc 'bash scripts/linux/ci-container-steps.sh fmt-clippy'

      - name: Run unit, integration, and doc tests
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          extra-args: --platform ${{ env.PLATFORM }} ${{ env.CONTAINER_ENV }}
          script: bash -lc 'bash scripts/linux/ci-container-steps.sh test'

      - name: Run coverage
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          extra-args: --platform ${{ env.PLATFORM }} ${{ env.CONTAINER_ENV }}
          script: bash -lc 'bash scripts/linux/ci-container-steps.sh coverage'

      - name: Run benchmarks
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          extra-args: --platform ${{ env.PLATFORM }} ${{ env.CONTAINER_ENV }}
          script: bash -lc 'bash scripts/linux/ci-container-steps.sh bench'

      - name: 🛠️ Build release binary
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          extra-args: --platform ${{ env.PLATFORM }} ${{ env.CONTAINER_ENV }}
          script: bash -lc 'bash scripts/linux/ci-container-steps.sh release'

      # --privileged is here so AppImage creation can reach FUSE. --device
      # /dev/fuse would be the narrower grant, but the AppImage tooling also
      # wants the mount capability; extract-and-run avoids FUSE entirely and
      # is the better long-term fix.
      - name: 📦 Create archive (tar)
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          extra-args: >-
            --privileged --platform ${{ env.PLATFORM }} ${{ env.CONTAINER_ENV }}
            -e BINARY="${{ env.BINARY }}"
            -e BINARY_FILE="${{ env.BINARY_FILE }}"
            -e VERSION="${{ env.VERSION }}"
            -e PACKAGE_TYPES="${{ env.PACKAGE_TYPES }}"
            -e PLATFORM="${{ env.PLATFORM }}"
            -e ARCH="${{ env.ARCH }}"
          script: >-
            bash -lc 'set -e;
            git config --global --add safe.directory /workspace || true;
            bash third_party/ANTfrastructure/linux/scripts/06-packaging/package_archive.sh
            --binary "${BINARY}"
            --binary-file "${BINARY_FILE}"
            --binary-path "target/release/${BINARY_FILE}"
            --version "${VERSION}"
            --package-types "${PACKAGE_TYPES}"
            --platform "${PLATFORM}"
            --arch "${ARCH}"
            --flatpak-manifest "packaging/flatpak/kataglyphis.flatpak.json"
            --desktop-file "packaging/flatpak/kataglyphis.desktop"
            --icon-file "packaging/flatpak/icon.png"
            --archive-out-file "dist/archive_path.txt"
            --no-github-output'

      # Named by VERSION, not by github.ref_name. On a pull_request the ref name
      # is `<number>/merge`, and upload-artifact refuses a `/` in a name - so
      # every PR run of this lane went red at this step with the build, tests
      # and package all green (run 35752031200, 2026-09-22). VERSION comes from
      # VERSION.txt and is what the Windows lane and the tarball already use.
      #
      # `error`, not the `warn` default: `always()` means this also runs after a
      # failed build, and a lane that produced nothing must not upload nothing
      # and look delivered.
      - name: Upload all artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.BINARY }}-${{ env.VERSION }}-${{ inputs.artifact-suffix }}-all
          if-no-files-found: error
          path: |
            tarpaulin-report.html
            tarpaulin-report.xml
            target/release/${{ env.BINARY_FILE }}
            dist/**

      - name: Create docs
        if: inputs.docs
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          extra-args: --platform ${{ env.PLATFORM }} ${{ env.CONTAINER_ENV }}
          script: bash -lc 'bash scripts/linux/ci-container-steps.sh docs'

      # The family's FTP action owns the readability fixup (the `sudo chown -R`
      # step that used to precede this) and pins the upstream action by SHA.
      - name: 📂 Sync files to domain
        # Only publish docs from the default branch. Every push to develop used
        # to overwrite the live documentation with in-progress state.
        #
        # ASKED FOR, NOT TYPED. This said `refs/heads/main` while main was an
        # abandoned branch three 'fix' commits deep and develop carried every
        # commit and was the default - so the comment above was false and the
        # docs at rust.jonasheinle.de were never republished at all. Reading
        # the repository's own default_branch keeps the comment true through
        # the main/develop reconciliation and through whatever comes after it.
        # Inside a called workflow `github` is the CALLER's context, so this
        # still reads the push that started linux-x64.yml.
        if: inputs.docs && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
        # Best-effort publish: a transient FTP control-socket timeout
        # (observed 2026-07-22) must NOT red-light a lane whose build, test
        # and package all passed. The step still shows as failed with a
        # warning annotation - it just no longer fails the job. Note the
        # action's own policy is the opposite ("a failed publish fails the
        # job", see its action.yml); this tolerance is the owner's call.
        continue-on-error: true
        uses: Kataglyphis/ANTfrastructure/.github/actions/deploy-over-ftp@main
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PW }}
          local-dir: "./target/doc/"
