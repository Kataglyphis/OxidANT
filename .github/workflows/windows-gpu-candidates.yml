name: Windows x64 GPU candidates

on:
  workflow_dispatch:
    inputs:
      invocation-scope:
        description: Unique lowercase scope for overlapping calls in the same run
        type: string
        default: default
      gpu-vendor:
        description: GPU vendor candidates to build and profile
        type: choice
        options: [all, nvidia, amd]
        default: all
      verify-gpu:
        description: Profile the candidate on vendor-labelled Windows GPU runners
        type: boolean
        default: false
      amd-device-index:
        description: DXGI adapter index for the AMD DirectML GPU runner
        type: string
        default: '0'
  workflow_call:
    inputs:
      invocation-scope:
        type: string
        default: default
      gpu-vendor:
        type: string
        default: all
      verify-gpu:
        type: boolean
        default: false
      amd-device-index:
        type: string
        default: '0'
    secrets:
      GHCR_PAT:
        required: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: windows-2025
    timeout-minutes: 10
    outputs:
      repository: ${{ steps.image.outputs.repository }}
      suffix: ${{ steps.scope.outputs.suffix }}
      matrix: ${{ steps.vendors.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Validate invocation scope and select GPU vendors
        id: scope
        shell: pwsh
        env:
          GPU_INVOCATION_SCOPE: ${{ inputs.invocation-scope }}
        run: |
          python -I third_party/ANTfrastructure/shared/python/gpu_invocation_scope.py
          if ($LASTEXITCODE -ne 0) { throw 'Invalid GPU invocation scope.' }
      - name: Select GPU vendors
        id: vendors
        shell: pwsh
        env:
          GPU_VENDOR: ${{ inputs.gpu-vendor }}
        run: |
          python -I scripts/windows/select_gpu_matrix.py
          if ($LASTEXITCODE -ne 0) { throw 'Invalid GPU vendor selection.' }
      - name: Check pinned GPU packaging APIs
        shell: pwsh
        run: |
          ./scripts/windows/Test-GpuCandidateInputs.ps1
          if (-not (Test-Path -LiteralPath third_party/ANTfrastructure/windows/scripts/diagnostics/verify-dxgi-adapter.py -PathType Leaf)) { throw 'Pinned ANTfrastructure lacks the DXGI adapter verifier.' }
      - name: Test the image preflight
        run: |
          python scripts/windows/tests/test_gpu_candidate_inputs.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/windows/tests/test_gpu_workflow.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python third_party/ANTfrastructure/windows/scripts/tests/test_dxgi_adapter.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test the optional detector parity gate
        if: ${{ inputs.verify-gpu }}
        shell: pwsh
        run: |
          python -I scripts/windows/tests/test_gpu_detector_parity.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows detector parity fixture failed' }
      - name: Test GPU launcher and architecture guards
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 3.4.0
          $result = Invoke-Pester -Script @('scripts/windows/tests/GpuCandidateArch.Tests.ps1', 'scripts/windows/tests/DirectMLLauncher.Tests.ps1') -PassThru
          if ($result.FailedCount -ne 0 -or $result.PassedCount -ne 8) { throw 'GPU candidate fixture failed or did not run all cases.' }
      - name: Read the registry prefix
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image="$(bash third_party/ANTfrastructure/linux/scripts/ci-image-ref.sh --windows)"
          repository="${image%:*}"
          [[ -n "$repository" && "$repository" != "$image" ]] || { echo 'Invalid registry image reference' >&2; exit 1; }
          printf 'repository=%s\n' "$repository" >> "$GITHUB_OUTPUT"

  candidate:
    needs: preflight
    name: Unverified ${{ matrix.provider }} candidate (${{ matrix.vendor }}, x64)
    runs-on: windows-2025
    concurrency:
      group: windows-gpu-candidates-${{ github.ref }}-${{ github.workflow }}-${{ needs.preflight.outputs.suffix }}-${{ matrix.vendor }}
      cancel-in-progress: true
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - name: Prepare the registry image and short-path checkout
        id: prep
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-windows-container-host@develop
        with:
          image: ${{ format('{0}:{1}', needs.preflight.outputs.repository, matrix.tag) }}
          target-arch: amd64
          submodules: 'true'
          registry-password: ${{ secrets.GHCR_PAT }}
      - name: Build and verify the portable candidate
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-windows-container@develop
        with:
          image: ${{ steps.prep.outputs.image }}
          file: C:\ws\scripts\windows\Build-GpuCandidate.ps1
          file-args: |
            -Vendor
            ${{ matrix.vendor }}
      - name: CPU inference from the finished ZIP
        shell: pwsh
        env:
          WORKSPACE: ${{ steps.prep.outputs.workspace }}
          VENDOR: ${{ matrix.vendor }}
          PROVIDER: ${{ matrix.provider }}
          INVOCATION_SUFFIX: ${{ needs.preflight.outputs.suffix }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:WORKSPACE "dist/gpu-$env:VENDOR/oxidant-$env:PROVIDER-$env:VENDOR-windows-x64-unverified.zip"
          $stage = Join-Path $env:RUNNER_TEMP "oxidant-gpu-$env:VENDOR-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT$env:INVOCATION_SUFFIX"
          $null = New-Item -ItemType Directory -Path $stage
          & "$env:SystemRoot\System32\tar.exe" -xf $zip -C $stage
          if ($LASTEXITCODE -ne 0) { throw 'Cannot unpack the GPU candidate' }
          $model = & (Join-Path $env:WORKSPACE 'scripts/windows/Get-ModelLockFile.ps1') -Suffix '.onnx'
          if (-not (Test-Path -LiteralPath (Join-Path $stage "resources/models/$model") -PathType Leaf)) { throw 'Bundled model missing' }
          if (-not (Test-Path -LiteralPath (Join-Path $stage 'lib/gstreamer-1.0') -PathType Container)) { throw 'Bundled GStreamer plugins missing' }
          Remove-Item Env:\KATAGLYPHIS_ONNX_MODEL -ErrorAction SilentlyContinue
          $env:KATAGLYPHIS_ORT_DEVICE = 'cpu'
          $env:ORT_DYLIB_PATH = Join-Path $stage 'onnxruntime.dll'
          & (Join-Path $stage "oxidant-$env:PROVIDER.cmd") onnx-check
          if ($LASTEXITCODE -ne 0) { throw 'CPU inference from the candidate failed' }
          & (Join-Path $stage "oxidant-$env:PROVIDER.cmd") media-check
          if ($LASTEXITCODE -ne 0) { throw 'Bundled media pipeline from the candidate failed' }
      - name: Upload the unverified candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unverified-oxidant-${{ matrix.provider }}-${{ matrix.vendor }}-windows-x64-attempt-${{ github.run_attempt }}${{ needs.preflight.outputs.suffix }}
          overwrite: false
          path: ${{ steps.prep.outputs.workspace }}/dist/gpu-${{ matrix.vendor }}/*.zip
          if-no-files-found: error
      # Only reached when every check above passed; release.yml collects this name.
      - name: Name the checked package for a release
        shell: pwsh
        env:
          SOURCE: ${{ steps.prep.outputs.workspace }}/dist/gpu-${{ matrix.vendor }}
          TARGET: ${{ runner.temp }}/gpu-release-packages
        run: |
          $zips = @(Get-ChildItem -LiteralPath $env:SOURCE -Filter '*.zip' -File)
          if ($zips.Count -ne 1) { throw "Expected one GPU package ZIP, found $($zips.Count)" }
          $null = New-Item -ItemType Directory -Force -Path $env:TARGET
          Copy-Item -LiteralPath $zips[0].FullName -Destination (Join-Path $env:TARGET 'windows-x64-gpu-${{ matrix.vendor }}.zip')
      - name: Upload the checked GPU package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oxidant-gpu-${{ matrix.vendor }}-windows-x64${{ needs.preflight.outputs.suffix }}
          overwrite: true
          if-no-files-found: error
          path: ${{ runner.temp }}/gpu-release-packages/*

  gpu-profile:
    if: ${{ !cancelled() && inputs.verify-gpu && needs.preflight.result == 'success' }}
    needs: [preflight, candidate]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    runs-on: [self-hosted, Windows, X64, '${{ matrix.runner }}']
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unverified-oxidant-${{ matrix.provider }}-${{ matrix.vendor }}-windows-x64-attempt-${{ github.run_attempt }}${{ needs.preflight.outputs.suffix }}
          path: ${{ runner.temp }}/oxidant-gpu-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.vendor }}${{ needs.preflight.outputs.suffix }}
      - name: Require model operators on the selected GPU provider
        shell: pwsh
        env:
          PROVIDER: ${{ matrix.provider }}
          DIRECTML_INDEX: ${{ inputs.amd-device-index }}
          CANDIDATE_DIR: ${{ runner.temp }}/oxidant-gpu-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.vendor }}${{ needs.preflight.outputs.suffix }}
          INVOCATION_SUFFIX: ${{ needs.preflight.outputs.suffix }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zips = @(Get-ChildItem -LiteralPath $env:CANDIDATE_DIR -Filter '*.zip' -File)
          if ($zips.Count -ne 1) { throw "Expected one GPU candidate ZIP, found $($zips.Count)" }
          $stage = Join-Path $env:RUNNER_TEMP "oxidant-gpu-profile-$env:PROVIDER-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT$env:INVOCATION_SUFFIX"
          $null = New-Item -ItemType Directory -Path $stage
          & "$env:SystemRoot\System32\tar.exe" -xf $zips[0].FullName -C $stage
          if ($LASTEXITCODE -ne 0) { throw 'Cannot unpack the GPU candidate' }
          $model = & scripts/windows/Get-ModelLockFile.ps1 -Suffix '.onnx'
          if (-not (Test-Path -LiteralPath (Join-Path $stage "resources/models/$model") -PathType Leaf)) { throw 'Bundled model missing' }
          if (-not (Test-Path -LiteralPath (Join-Path $stage 'onnxruntime.dll') -PathType Leaf)) { throw 'Bundled ONNX Runtime missing' }
          Remove-Item Env:\KATAGLYPHIS_ONNX_MODEL, Env:\KATAGLYPHIS_ORT_DEVICE, Env:\KATAGLYPHIS_ONNX_BACKEND, Env:\ORT_DYLIB_PATH -ErrorAction SilentlyContinue
          if ($env:PROVIDER -eq 'directml') {
            python third_party/ANTfrastructure/windows/scripts/diagnostics/verify-dxgi-adapter.py --vendor amd --index $env:DIRECTML_INDEX
            if ($LASTEXITCODE -ne 0) { throw 'The selected DirectML adapter is not a physical AMD GPU.' }
            $env:KATAGLYPHIS_DIRECTML_DEVICE_ID = $env:DIRECTML_INDEX
          }
          & (Join-Path $stage "oxidant-$env:PROVIDER.cmd") onnx-check --profile (Join-Path $stage 'ort-profile')
          if ($LASTEXITCODE -ne 0) { throw 'GPU inference or profiling failed' }
          $profiles = @(Get-ChildItem -LiteralPath $stage -Filter 'ort-profile*.json' -File)
          if ($profiles.Count -ne 1) { throw "Expected one ORT profile, found $($profiles.Count)" }
          python scripts/verify-ort-gpu-profile.py $profiles[0].FullName --device $env:PROVIDER
          if ($LASTEXITCODE -ne 0) { throw 'No model operator ran on the requested GPU provider' }
          python -I scripts/windows/check_gpu_detector_parity.py $stage --device $env:PROVIDER --directml-index $env:DIRECTML_INDEX
          if ($LASTEXITCODE -ne 0) { throw 'Windows ZIP detector parity or per-run GPU profiling failed' }
