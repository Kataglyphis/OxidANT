name: Linux NVIDIA GPU package candidates

on:
  workflow_dispatch:
    inputs:
      verify-gpu:
        description: Profile packaged inference on self-hosted NVIDIA GPU runners for both architectures
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: linux-nvidia-gpu-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  build:
    name: NVIDIA candidate (${{ matrix.arch }}, host CUDA required)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: linux/amd64
            runner: ubuntu-26.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      REF_NAME: ${{ github.ref_name }}
      RUN_NUMBER: ${{ github.run_number }}
    steps:
      - name: Check out pinned sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Check pinned GPU verification APIs
        shell: bash
        run: |
          set -euo pipefail
          hub=third_party/ANTfrastructure/linux/scripts/06-packaging
          test -f "$hub/verify-ort-appimage-payload.sh" || { echo 'Pinned ANTfrastructure lacks the finished GPU AppImage verifier' >&2; exit 1; }
          if ! test -f "$hub/ort-runtime-bundle.sh" || ! grep -q 'ort_assert_no_bundled_host_runtime' "$hub/ort-runtime-bundle.sh"; then
            echo 'Pinned ANTfrastructure lacks the GPU host-runtime exclusion check' >&2; exit 1
          fi
          if ! test -f "$hub/../01-core/platform.sh" || ! grep -q '^arch_normalize()' "$hub/../01-core/platform.sh"; then
            echo 'Pinned ANTfrastructure lacks GPU package architecture normalization' >&2; exit 1
          fi
          python3 "$hub/stage-ort-wheel-licenses.py" --help | grep -q -- --require-unstripped || { echo 'Pinned ANTfrastructure lacks exact GPU wheel verification' >&2; exit 1; }
          bash scripts/linux/tests/test-verify-gpu-packages.sh
          bash scripts/linux/tests/test-profile-gpu-bundle.sh
          python3 scripts/windows/tests/test_gpu_workflow.py
      - name: Select registry image
        id: image
        shell: bash
        run: |
          cpu_image="$(bash third_party/ANTfrastructure/linux/scripts/ci-image-ref.sh --linux)"
          printf 'ref=%s:latest-nvidia\n' "${cpu_image%:*}" >> "$GITHUB_OUTPUT"
      - name: Prepare disk and pull the GPU image
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@develop
        with:
          image: ${{ steps.image.outputs.ref }}
          checkout: 'false'
          free-disk-space: 'true'
          pull-first: 'false'
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}
      - name: Compute version
        run: bash scripts/linux/compute-version.sh
      - name: Preflight, build and verify packages
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          docker run --rm --user root --platform "$PLATFORM" \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            -e VERSION -e ARCH -e PLATFORM -e CARGO_HOME=/tmp/cargo-home -e CARGO_TERM_COLOR=always \
            "$IMAGE" bash -c '
              set -euo pipefail
              hub=third_party/ANTfrastructure/linux/scripts/06-packaging
              test -f "$hub/verify-ort-appimage-payload.sh" || {
                echo "Pinned ANTfrastructure lacks the finished GPU AppImage verifier" >&2; exit 1;
              }
              python3 "$hub/stage-ort-wheel-licenses.py" --help | grep -q -- --require-unstripped || {
                echo "Pinned ANTfrastructure lacks exact GPU wheel verification" >&2; exit 1;
              }
              ort=/usr/local/lib/onnxruntime-gpu/lib
              python3 "$hub/stage-ort-wheel-licenses.py" --require-unstripped \
                --strip "${STRIP:-strip}" \
                --wheel-dir /opt/onnxruntime-wheels --destination /tmp/oxidant-ort-preflight \
                --library "$ort/libonnxruntime.so.1" \
                --library "$ort/libonnxruntime_providers_shared.so" \
                --library "$ort/libonnxruntime_providers_cuda.so"
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libgtk-4-dev
              mkdir -p "$CARGO_HOME"
              chown 1001:1001 "$CARGO_HOME"
              runuser -u kataglyphis -- bash -c '\''
                set -euo pipefail
                cargo test --locked -p kataglyphis_inference --lib device_tests
                cargo test --locked -p kataglyphis_inference --test gpu_request
                python3 scripts/linux/tests/test-ort-gpu-profile.py
                cargo build --locked --release -p kataglyphis_cli
                KATAGLYPHIS_PACKAGING_WORKDIR=/tmp/oxidant-gpu-package-work \
                bash scripts/linux/package-linux.sh --binary-path target/release/kataglyphis_cli \
                  --version "$VERSION" --arch "$ARCH" --platform "$PLATFORM" \
                  --package-types tar,deb,appimage --ort-variant nvidia
                profile_dir="$(mktemp -d)"
                env -u KATAGLYPHIS_ONNX_MODEL ORT_DYLIB_PATH=/tmp/oxidant-gpu-package-work/oxidant/lib/libonnxruntime.so \
                KATAGLYPHIS_ORT_DEVICE=cpu /tmp/oxidant-gpu-package-work/oxidant/oxidant \
                  onnx-check --profile "$profile_dir/profile"
                mapfile -t profiles < <(find "$profile_dir" -maxdepth 1 -type f -name "profile*.json")
                [[ ${#profiles[@]} -eq 1 ]]
                python3 scripts/verify-ort-gpu-profile.py "${profiles[0]}" --device cpu
                if python3 scripts/verify-ort-gpu-profile.py "${profiles[0]}" --device cuda; then
                  echo "CPU-only profile was accepted as GPU execution" >&2; exit 1
                fi
                bash scripts/linux/verify-gpu-packages.sh dist "$ARCH" nvidia
              '\''
            '
      - name: Upload unverified candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oxidant-linux-${{ matrix.arch }}-nvidia-host-runtime-candidate-${{ github.run_id }}
          overwrite: true
          if-no-files-found: error
          path: dist/**

  clean-host:
    name: Clean-host CPU inference and missing CUDA (${{ matrix.arch }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the missing-runtime check
        run: bash scripts/linux/tests/test-check-missing-gpu-runtime.sh
      - name: Install and run CPU inference
        uses: Kataglyphis/ANTfrastructure/.github/actions/clean-host-package-check@develop
        with:
          artifact: oxidant-linux-${{ matrix.arch }}-nvidia-host-runtime-candidate-${{ github.run_id }}
          scan-elves: 'false'
          deb: '*.deb'
          deb-command: env -u KATAGLYPHIS_ONNX_MODEL KATAGLYPHIS_ORT_DEVICE=cpu oxidant onnx-check && oxidant media-check && bash "$GITHUB_WORKSPACE/scripts/linux/check-missing-gpu-runtime.sh" nvidia oxidant
          tarball: '*.tar.gz'
          tarball-command: env -u KATAGLYPHIS_ONNX_MODEL KATAGLYPHIS_ORT_DEVICE=cpu ./oxidant onnx-check && ./oxidant media-check && bash "$GITHUB_WORKSPACE/scripts/linux/check-missing-gpu-runtime.sh" nvidia ./oxidant
          appimage: '*.AppImage'
          appimage-command: env -u KATAGLYPHIS_ONNX_MODEL KATAGLYPHIS_ORT_DEVICE=cpu "$APPIMAGE" onnx-check && "$APPIMAGE" media-check && bash "$GITHUB_WORKSPACE/scripts/linux/check-missing-gpu-runtime.sh" nvidia "$APPIMAGE"

  gpu-profile:
    if: ${{ inputs.verify-gpu }}
    needs: [build, clean-host]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner-arch: X64
          - arch: arm64
            runner-arch: ARM64
    runs-on: [self-hosted, Linux, '${{ matrix.runner-arch }}', gpu-nvidia-cuda]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oxidant-linux-${{ matrix.arch }}-nvidia-host-runtime-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/oxidant-nvidia-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
      - name: Require model operators on CUDA
        shell: bash
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/oxidant-nvidia-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
        run: |
          set -euo pipefail
          mapfile -t archives < <(find "$CANDIDATE_DIR" -type f -name '*.tar.gz')
          [[ ${#archives[@]} -eq 1 ]] || { echo 'Expected one candidate tarball' >&2; exit 1; }
          work="$(mktemp -d "${RUNNER_TEMP}/oxidant-cuda-profile.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          tar -xzf "${archives[0]}" -C "$work"
          bash scripts/linux/profile-gpu-bundle.sh "$work/oxidant" cuda "$work/ort"
