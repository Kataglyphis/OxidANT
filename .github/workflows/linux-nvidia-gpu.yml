name: Linux NVIDIA GPU package candidates

on:
  workflow_dispatch:
    inputs:
      invocation-scope:
        description: Unique lowercase scope for overlapping calls in the same run
        type: string
        default: default
      verify-gpu:
        description: Profile packaged inference on self-hosted NVIDIA GPU runners for the selected architectures
        type: boolean
        default: false
      promote-verified:
        description: Stage checked NVIDIA packages after hardware profiling on the selected architectures
        type: boolean
        default: false
      architecture:
        description: NVIDIA candidate architectures to build
        type: choice
        options: [both, x64, arm64]
        default: both
  workflow_call:
    inputs:
      invocation-scope:
        type: string
        default: default
      verify-gpu:
        type: boolean
        default: false
      promote-verified:
        type: boolean
        default: false
      architecture:
        type: string
        default: both
    secrets:
      GHCR_PAT:
        required: false

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-26.04
    outputs:
      architecture: ${{ steps.select.outputs.architecture }}
      matrix: ${{ steps.select.outputs.matrix }}
      suffix: ${{ steps.scope.outputs.suffix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Validate the invocation scope
        id: scope
        env:
          GPU_INVOCATION_SCOPE: ${{ inputs.invocation-scope }}
        run: python3 -I third_party/ANTfrastructure/shared/python/gpu_invocation_scope.py
      - name: Validate the requested architectures
        id: select
        shell: bash
        env:
          ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          set -euo pipefail
          x64='{"arch":"x64","producer":"build-x64","runner":"ubuntu-26.04","runner-arch":"X64"}'
          arm64='{"arch":"arm64","producer":"build-arm64","runner":"ubuntu-26.04-arm","runner-arch":"ARM64"}'
          case "$ARCHITECTURE" in
            both) rows="$x64,$arm64" ;;
            x64) rows="$x64" ;;
            arm64) rows="$arm64" ;;
            *) echo '::error::architecture must be both, x64 or arm64'; exit 1 ;;
          esac
          printf 'architecture=%s\nmatrix={"include":[%s]}\n' "$ARCHITECTURE" "$rows" >> "$GITHUB_OUTPUT"

  build-x64:
    needs: select
    if: ${{ needs.select.result == 'success' && (needs.select.outputs.architecture == 'both' || needs.select.outputs.architecture == 'x64') }}
    uses: ./.github/workflows/linux-nvidia-gpu-build.yml
    concurrency:
      group: linux-nvidia-gpu-${{ github.ref }}-${{ github.workflow }}-${{ needs.select.outputs.suffix }}-x64
      cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
    with:
      invocation-scope: ${{ inputs.invocation-scope }}
      arch: x64
      platform: linux/amd64
      runner: ubuntu-26.04
      verify-gpu: ${{ inputs.verify-gpu }}
      promote-verified: ${{ inputs.promote-verified }}
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  build-arm64:
    needs: select
    if: ${{ needs.select.result == 'success' && (needs.select.outputs.architecture == 'both' || needs.select.outputs.architecture == 'arm64') }}
    uses: ./.github/workflows/linux-nvidia-gpu-build.yml
    concurrency:
      group: linux-nvidia-gpu-${{ github.ref }}-${{ github.workflow }}-${{ needs.select.outputs.suffix }}-arm64
      cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
    with:
      invocation-scope: ${{ inputs.invocation-scope }}
      arch: arm64
      platform: linux/arm64
      runner: ubuntu-26.04-arm
      verify-gpu: ${{ inputs.verify-gpu }}
      promote-verified: ${{ inputs.promote-verified }}
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  clean-host:
    name: Clean-host CPU inference and missing CUDA (${{ matrix.arch }})
    needs: [select, build-x64, build-arm64]
    if: ${{ !cancelled() && needs.select.result == 'success' && (needs.select.outputs.architecture == 'arm64' || needs.build-x64.result == 'success') && (needs.select.outputs.architecture == 'x64' || needs.build-arm64.result == 'success') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Require a candidate from this attempt
        if: ${{ inputs.promote-verified }}
        env:
          PRODUCER_ATTEMPT: ${{ needs[matrix.producer].outputs.producer_attempt }}
        run: test "$PRODUCER_ATTEMPT" = "$GITHUB_RUN_ATTEMPT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the missing-runtime check
        run: bash scripts/linux/tests/test-check-missing-gpu-runtime.sh
      - name: Install and run CPU inference
        if: ${{ !inputs.promote-verified }}
        uses: Kataglyphis/ANTfrastructure/.github/actions/clean-host-package-check@develop
        with:
          artifact: oxidant-linux-${{ matrix.arch }}-nvidia-host-runtime-candidate-${{ github.run_id }}-attempt-${{ github.run_attempt }}${{ needs.select.outputs.suffix }}
          scan-elves: 'false'
          deb: '*.deb'
          deb-command: env -u KATAGLYPHIS_ONNX_MODEL KATAGLYPHIS_ORT_DEVICE=cpu oxidant onnx-check && oxidant media-check && bash "$GITHUB_WORKSPACE/scripts/linux/check-missing-gpu-runtime.sh" nvidia oxidant
          tarball: '*.tar.gz'
          tarball-command: env -u KATAGLYPHIS_ONNX_MODEL KATAGLYPHIS_ORT_DEVICE=cpu ./oxidant onnx-check && ./oxidant media-check && bash "$GITHUB_WORKSPACE/scripts/linux/check-missing-gpu-runtime.sh" nvidia ./oxidant
          appimage: '*.AppImage'
          appimage-command: env -u KATAGLYPHIS_ONNX_MODEL KATAGLYPHIS_ORT_DEVICE=cpu "$APPIMAGE" onnx-check && "$APPIMAGE" media-check && bash "$GITHUB_WORKSPACE/scripts/linux/check-missing-gpu-runtime.sh" nvidia "$APPIMAGE"

      - name: Check immutable packages with isolated CPU inference
        if: ${{ inputs.promote-verified }}
        uses: Kataglyphis/ANTfrastructure/.github/actions/clean-host-package-check@da0bdf709f491b900a9ed02c821d7cbc3a13c8be
        with:
          artifact: oxidant-linux-${{ matrix.arch }}-nvidia-host-runtime-candidate-${{ github.run_id }}-attempt-${{ github.run_attempt }}${{ needs.select.outputs.suffix }}
          scan-elves: 'false'
          deb: '*.deb'
          deb-command: bash "$GITHUB_WORKSPACE/scripts/linux/check-gpu-clean-host.sh" nvidia oxidant
          tarball: '*.tar.gz'
          tarball-command: bash "$GITHUB_WORKSPACE/scripts/linux/check-gpu-clean-host.sh" nvidia ./oxidant
          appimage: '*.AppImage'
          appimage-command: bash "$GITHUB_WORKSPACE/scripts/linux/check-gpu-clean-host.sh" nvidia "$APPIMAGE"
          artifact-id: ${{ needs[matrix.producer].outputs.artifact_id }}
          artifact-digest: ${{ needs[matrix.producer].outputs.artifact_digest }}
          artifact-files: ${{ needs[matrix.producer].outputs.artifact_files }}
          gpu-vendor: nvidia
          gpu-arch: ${{ matrix.arch }}
          gpu-receipt: ${{ runner.temp }}/oxidant-nvidia-clean-receipt.json
          max-uncompressed-bytes: '42949672960'
          max-compression-ratio: '1000'
      - name: Upload the clean-host receipt
        if: ${{ inputs.promote-verified }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unverified-oxidant-nvidia-${{ matrix.arch }}-clean-receipt-${{ github.run_id }}-attempt-${{ github.run_attempt }}${{ needs.select.outputs.suffix }}
          path: ${{ runner.temp }}/oxidant-nvidia-clean-receipt.json
          overwrite: false
          if-no-files-found: error

  gpu-profile:
    if: ${{ !cancelled() && inputs.verify-gpu && needs.select.result == 'success' && (needs.select.outputs.architecture == 'arm64' || needs.build-x64.result == 'success') && (needs.select.outputs.architecture == 'x64' || needs.build-arm64.result == 'success') && needs.clean-host.result == 'success' }}
    needs: [select, build-x64, build-arm64, clean-host]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: [self-hosted, Linux, '${{ matrix.runner-arch }}', gpu-nvidia-cuda]
    timeout-minutes: 30
    steps:
      - name: Require a candidate from this attempt
        if: ${{ inputs.promote-verified }}
        env:
          PRODUCER_ATTEMPT: ${{ needs[matrix.producer].outputs.producer_attempt }}
        run: test "$PRODUCER_ATTEMPT" = "$GITHUB_RUN_ATTEMPT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ !inputs.promote-verified }}
        with:
          name: oxidant-linux-${{ matrix.arch }}-nvidia-host-runtime-candidate-${{ github.run_id }}-attempt-${{ github.run_attempt }}${{ needs.select.outputs.suffix }}
          path: ${{ runner.temp }}/oxidant-nvidia-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}${{ needs.select.outputs.suffix }}
      - name: Require model operators on CUDA from every package
        if: ${{ !inputs.promote-verified }}
        shell: bash
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/oxidant-nvidia-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}${{ needs.select.outputs.suffix }}
        run: |
          bash scripts/linux/profile-gpu-packages.sh "$CANDIDATE_DIR" cuda

      - name: Profile immutable NVIDIA packages and record their bytes
        if: ${{ inputs.promote-verified }}
        uses: Kataglyphis/ANTfrastructure/.github/actions/gpu-package-check@da0bdf709f491b900a9ed02c821d7cbc3a13c8be
        with:
          artifact-id: ${{ needs[matrix.producer].outputs.artifact_id }}
          artifact-digest: ${{ needs[matrix.producer].outputs.artifact_digest }}
          artifact-files: ${{ needs[matrix.producer].outputs.artifact_files }}
          gpu-vendor: nvidia
          gpu-arch: ${{ matrix.arch }}
          gpu-receipt: ${{ runner.temp }}/oxidant-nvidia-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}${{ needs.select.outputs.suffix }}-gpu-receipt.json
          max-uncompressed-bytes: '42949672960'
          max-compression-ratio: '1000'
          command: env ANTFRASTRUCTURE_DIR="$GITHUB_WORKSPACE/third_party/ANTfrastructure" bash scripts/linux/profile-gpu-packages.sh "$GPU_PACKAGE_DIR" cuda "$GITHUB_WORKSPACE/crates/inference/tests/fixtures/two_cats.jpg"
      - name: Upload the GPU profile receipt
        if: ${{ inputs.promote-verified }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unverified-oxidant-nvidia-${{ matrix.arch }}-gpu-receipt-${{ github.run_id }}-attempt-${{ github.run_attempt }}${{ needs.select.outputs.suffix }}
          path: ${{ runner.temp }}/oxidant-nvidia-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}${{ needs.select.outputs.suffix }}-gpu-receipt.json
          overwrite: false
          if-no-files-found: error

  stage-verified:
    if: ${{ !cancelled() && inputs.promote-verified && inputs.verify-gpu && needs.select.result == 'success' && (needs.select.outputs.architecture == 'arm64' || needs.build-x64.result == 'success') && (needs.select.outputs.architecture == 'x64' || needs.build-arm64.result == 'success') && needs.clean-host.result == 'success' && needs.gpu-profile.result == 'success' }}
    needs: [select, build-x64, build-arm64, clean-host, gpu-profile]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Require a candidate from this attempt
        env:
          PRODUCER_ATTEMPT: ${{ needs[matrix.producer].outputs.producer_attempt }}
        run: test "$PRODUCER_ATTEMPT" = "$GITHUB_RUN_ATTEMPT"
      - name: Download immutable candidate archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs[matrix.producer].outputs.artifact_id }}
          path: ${{ runner.temp }}/oxidant-nvidia-promotion-archive
          skip-decompress: true
          digest-mismatch: error
      - name: Select the downloaded archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' archives < <(find "$RUNNER_TEMP/oxidant-nvidia-promotion-archive" -mindepth 1 -maxdepth 1 -type f -print0)
          [[ ${#archives[@]} -eq 1 && "${archives[0]}" != *$'\n'* && "${archives[0]}" != *$'\r'* ]] || { echo 'Expected exactly one artifact archive' >&2; exit 1; }
          printf 'path=%s\n' "${archives[0]}" >> "$GITHUB_OUTPUT"
      - name: Download clean-host receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unverified-oxidant-nvidia-${{ matrix.arch }}-clean-receipt-${{ github.run_id }}-attempt-${{ github.run_attempt }}${{ needs.select.outputs.suffix }}
          path: ${{ runner.temp }}/oxidant-nvidia-clean-receipt
          digest-mismatch: error
      - name: Download GPU profile receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unverified-oxidant-nvidia-${{ matrix.arch }}-gpu-receipt-${{ github.run_id }}-attempt-${{ github.run_attempt }}${{ needs.select.outputs.suffix }}
          path: ${{ runner.temp }}/oxidant-nvidia-gpu-receipt
          digest-mismatch: error
      - name: Stage the exact checked packages
        uses: Kataglyphis/ANTfrastructure/.github/actions/stage-gpu-artifact@da0bdf709f491b900a9ed02c821d7cbc3a13c8be
        with:
          archive: ${{ steps.archive.outputs.path }}
          clean-receipt: ${{ runner.temp }}/oxidant-nvidia-clean-receipt/oxidant-nvidia-clean-receipt.json
          gpu-receipt: ${{ runner.temp }}/oxidant-nvidia-gpu-receipt/oxidant-nvidia-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}${{ needs.select.outputs.suffix }}-gpu-receipt.json
          output: ${{ runner.temp }}/oxidant-nvidia-verified-packages
          artifact-id: ${{ needs[matrix.producer].outputs.artifact_id }}
          artifact-digest: ${{ needs[matrix.producer].outputs.artifact_digest }}
          artifact-files: ${{ needs[matrix.producer].outputs.artifact_files }}
          gpu-platform: linux
          gpu-vendor: nvidia
          gpu-arch: ${{ matrix.arch }}
          max-uncompressed-bytes: '42949672960'
          max-compression-ratio: '1000'
      - name: Upload the checked NVIDIA packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-oxidant-linux-${{ matrix.arch }}-nvidia-${{ github.run_id }}-attempt-${{ github.run_attempt }}${{ needs.select.outputs.suffix }}
          path: ${{ runner.temp }}/oxidant-nvidia-verified-packages/*
          overwrite: false
          if-no-files-found: error
