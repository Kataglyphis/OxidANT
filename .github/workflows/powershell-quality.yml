name: Windows x64 · PowerShell quality measurements

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      strict:
        description: Fail this dispatch when PowerShell complexity exceeds the shared limits
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  measure:
    uses: Kataglyphis/ANTfrastructure/.github/workflows/powershell-quality.yml@develop
    with:
      lint-path: scripts
      # Complexity is fatal on push and PR; a dispatch without strict only measures.
      strict: ${{ github.event_name != 'workflow_dispatch' || inputs.strict == true }}
