name: Lint gates - shell, workflows, secrets, config

# THREE GATE JOBS, ONE FILE, AND TWO OF THEM ARE ONE LINE OF WIRING.
#
# The Linux job is ANTfrastructure's reusable `lint-gates.yml`, called rather
# than copied. This repo carried its own 60-line copy of that job until
# 2026-09-15, as six sibling consumers did, and every copy's header said to
# replace it with a `uses:` the day the hub grew a reusable lane. The hub has
# one now, so this is that day. What the hub half owns is unchanged: the gates
# themselves (shellcheck, actionlint + verify_ci_image_refs.py, gitleaks, ruff,
# the shared-config drift check and the consumer pin check), their pinned and
# SHA256-verified bootstraps, the git-ls-files scope construction, the
# empty-scope vacuity guards, the run-them-all-then-fail-once accumulator and
# the secret gate's self-test.
#
# A HUMAN STILL RUNS THE SAME COMMAND, which is the point of keeping the thin
# wrapper beside it:
#
#   bash scripts/linux/run-lint-gates.sh
#
# Both drive the hub aggregator with the same explicit consumer root and the
# same flags, including --ratchets. The root is passed explicitly and is never
# inferred upstream: the aggregator sits inside third_party/ANTfrastructure, so
# a self-derived root would grade ANTfrastructure's tree and report green over
# the wrong repository.
#
# BEFORE ANY OF THIS OxidANT RAN NO LINT GATE AT ALL. Tracked *.sh and the
# workflows went ungraded, and nothing ever scanned the tree for committed
# credentials - while rust_ubuntu26_04.yml publishes the docs over FTP with
# secrets.SERVER / secrets.USERNAME / secrets.PW.
#
# Cheap and first-to-finish: no image pull, no cargo build. All three jobs also
# cover a class the two Rust lanes cannot - valid YAML is not valid Actions,
# bash only reports a quoting or undefined-function bug when the line finally
# runs, and a PowerShell syntax error in the packaging scripts otherwise
# surfaces 40 minutes into a Windows container build.

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-gates:
    # submodules: 'true', NOT the input's 'recursive' default.
    # third_party/ANTfrastructure is where every gate, every pin and every SHA
    # in this lane comes from, and it is a top-level submodule - but its own
    # chain (DocumANTation -> md2pdfLib -> latex/*) is minutes of clone that
    # nothing here reads, and nothing grades it either: every scope drops
    # third_party/.
    #
    # ratchets: true since 2026-09-15. The eight --root measurement gates plus
    # the docs gate run over this tree, frozen at <repo>/<gate>.allow. The three
    # freeze files that have rows - comment-size, code-complexity,
    # dead-functions - were seeded from the first run and are committed; the
    # rest are empty by being absent, which the gates read as a zero baseline.
    uses: Kataglyphis/ANTfrastructure/.github/workflows/lint-gates.yml@main
    with:
      submodules: 'true'
      exclude: third_party
      ratchets: true

  # PowerShell lint: ANTfrastructure's Invoke-Lint.ps1 pointed at THIS repo's
  # PowerShell tree. Two passes - a mandatory parse + AST-trap gate, and
  # PSScriptAnalyzer.
  #
  # A SEPARATE JOB ON A WINDOWS RUNNER, not a step folded into the reusable lane
  # above: the script is Windows-native (it resolves its own settings file with
  # a backslash path and excludes `\archive\` by a backslash regex), and
  # PSScriptAnalyzer is a Windows-image module. Two runners in one workflow is
  # the shape, not an accident.
  #
  # KEPT DELIBERATELY at hub 49be50f0, which added `lint-powershell` and
  # `lint-path` to ANTfrastructure's reusable `python-ci-windows.yml` and names
  # THIS job as what they replace. The job those inputs add is this job, line
  # for line: windows-2025, `timeout-minutes: 20`, checkout at the same pinned
  # v7.0.1 SHA with `submodules: true` and `fetch-depth: 1`, PSScriptAnalyzer
  # `-RequiredVersion 1.25.0`, and `Invoke-Lint.ps1 -Path <lint-path>
  # -FailOnAnalyzer` - where `-FailOnAnalyzer` is unconditional upstream, the
  # same call this repo makes for the same measured reason, and `lint-path`
  # even defaults to the `scripts` this job passes. The gate is not the
  # problem.
  #
  # THE WORKFLOW AROUND IT IS. `python-ci-windows.yml` is the reusable lane for
  # the family's PYTHON consumers. Its `build-test-python-package-on-windows`
  # job carries no `if:`, so a caller cannot take the lint job alone: turning
  # `lint-powershell` on also pulls the winamd64 image and runs
  # `C:\workspace\scripts\windows\Build-Windows.ps1` as a Python package
  # build uploading `./dist/`, and the lane requires a `GHCR_PAT` secret to do
  # it. This repo is a Rust crate; its Windows container build is
  # rust_windows2025.yml and it has no Python package. Trading a two-minute
  # lint for a second container build is not the trade the input is offering.
  #
  # The hub exposes the gate nowhere else: `windows-scripts.yml` is the hub's
  # own lane and has no `workflow_call`. When a reusable lane carries this gate
  # without a Python build attached, this job becomes a `uses:` and this
  # comment goes with it.
  powershell-lint:
    name: PowerShell lint (ANTfrastructure gate)
    runs-on: windows-2025
    # Install-Module is the step that can hang.
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      # Top-level only: the only submodule these steps read is ANTfrastructure,
      # which carries both the gate script and its ruleset.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 1

      # Pinned, like the hub pins it for its own lane, so a runner-image module
      # refresh cannot silently change what this gate reports.
      - name: Install PSScriptAnalyzer
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser

      # -Path is the parameter ANTfrastructure added for exactly this case: a
      # consumer points the gate at ITS tree while the PSScriptAnalyzerSettings
      # file stays resolved against the SCRIPT's own location, so the hub's
      # ruleset is consumed BY REFERENCE and nothing is copied in here.
      # `scripts` is walked recursively, so scripts\windows\,
      # scripts\windows\container\ and scripts\windows\tests\ are all covered.
      #
      # -FailOnAnalyzer IS passed here, unlike in the sibling consumer this job
      # is modelled on. The analyzer is advisory by default because that repo
      # had untriaged findings; this tree has none - measured 2026-09-15, "PSSA:
      # 0 error(s), 0 warning(s) [PSScriptAnalyzer 1.25.0]" over all 9 files -
      # and a ratchet is only worth setting at the number you actually have. If
      # a finding appears, fix it or narrow the hub's ruleset; do not reach for
      # continue-on-error, which would hide the mandatory parse pass too.
      - name: Lint PowerShell (parse gate + PSScriptAnalyzer)
        run: >-
          pwsh -NoProfile -File third_party/ANTfrastructure/windows/scripts/Invoke-Lint.ps1
          -Path scripts -FailOnAnalyzer

  # Generated artifacts must not reach the index. .gitignore only stops a file
  # from being ADDED; it does nothing once a path is tracked, so nothing else
  # here can see the drift. `git rm --cached` has already been run over this
  # tree twice for exactly that - build logs under logs\windows\, and the
  # flatpak repo before them.
  #
  # The checks are ANTfrastructure's (WindowsRepoHygiene.Common); only this
  # repo's root and its list of generated-output pathspecs are local, because
  # what counts as generated is a property of this build.
  #
  # Windows runner and Pester 3.4.0 for the same reason submodule-pins.yml uses
  # them: the suite is written in the dash-less 3.4 assertion dialect, and 3.4
  # is a Windows PowerShell-era module. run-pester-suite refuses a vacuous pass
  # (TotalCount == 0 -> exit 1), so this cannot go green over an empty path.
  generated-artifacts:
    name: No generated artifact is tracked
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The suite imports WindowsRepoHygiene.Common out of the submodule
          # through scripts/windows/Resolve-BuildModule.ps1.
          submodules: true

      - name: Repo generated-artifact hygiene
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-pester-suite@main
        with:
          path: scripts/windows/tests
          version: '3.4.0'
