name: Lint gates

# Shell, workflows, secrets, config, PowerShell and tracked-artifact hygiene; bash scripts/linux/run-lint-gates.sh is the local twin.

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-gates:
    # submodules 'true', not 'recursive': the hub's own submodule chain is minutes of clone no gate reads.
    uses: Kataglyphis/ANTfrastructure/.github/workflows/lint-gates.yml@develop
    with:
      submodules: 'true'
      exclude: third_party
      ratchets: true

  # PowerShell lint: parse + AST traps, then PSScriptAnalyzer, over this repo's scripts tree.
  powershell-lint:
    uses: Kataglyphis/ANTfrastructure/.github/workflows/python-ci-windows.yml@develop
    # No `secrets:`: GHCR_PAT is optional upstream and this call pulls no image.
    with:
      # This repo has no Python package; false runs the lint job alone.
      build-python-package: false
      lint-powershell: true
      # Upstream's default too; explicit so a change to that default cannot re-point this gate.
      lint-path: scripts

  # The CI scripts' own suites on synthetic input: the per-crate coverage floor and the benchmark report.
  script-tests:
    name: CI script suites
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The suites source the hub's lib/test-harness.sh.
          submodules: true
      - name: Run every suite
        run: for suite in scripts/linux/tests/test-*.sh; do bash "$suite"; done

  # .gitignore does nothing once a path is tracked, so only this gate sees generated output reaching the index.
  generated-artifacts:
    name: No generated artifact is tracked
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The hub's suite runs from the submodule, and this repo's suites import its modules.
          submodules: true

      - name: Repo generated-artifact hygiene
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-pester-suite@develop
        with:
          # Grades this checkout against scripts/windows/generated-artifacts.txt.
          path: third_party/ANTfrastructure/shared/windows/tests/Repo.GeneratedArtifacts.Tests.ps1
          version: '3.4.0'

      - name: Windows module suites
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-pester-suite@develop
        with:
          path: scripts/windows/tests
          # The suites are written in Pester 3.4's dash-less assertion dialect.
          version: '3.4.0'
