# Linux x64 lane: only when and which runner; every step lives in reusable-linux.yml, and only this arch publishes the docs.
name: Linux x64 · build + test

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

# The GHCR pull and docs publish use their own secrets; this also caps the called workflow's token.
permissions:
  contents: read

# Grouped by display name so x64 and arm64 never cancel each other; default-branch runs (releases, docs) always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  # No timeout-minutes: a job that calls a reusable workflow may not carry one.
  build:
    name: Linux x64
    uses: ./.github/workflows/reusable-linux.yml
    permissions:
      contents: read
      # reusable-linux.yml's compiler-cache-save deletes its key's older entries.
      actions: write
    with:
      runner: ubuntu-26.04
      platform: linux/amd64
      arch: x64
      artifact-suffix: ubuntu-26.04-x64
      docs: true
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
      SERVER: ${{ secrets.SERVER }}
      USERNAME: ${{ secrets.USERNAME }}
      PW: ${{ secrets.PW }}

  # The only build of each optional feature, on every push like the lane (owner rule: no opt-in jobs); one image pull per row.
  feature-matrix:
    name: Feature check (${{ matrix.features }})
    runs-on: ubuntu-26.04
    # One image pull and one `cargo check` per row - no build, test or package.
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # The image's CARGO_HOME is root-owned and the container runs as uid 1001.
      CONTAINER_ENV: -e CARGO_HOME=/tmp/cargo-home -e CARGO_TERM_COLOR=always
    strategy:
      fail-fast: false
      matrix:
        # gui_unix is absent (needs GTK 4, which the image excludes); gui_windows is the row that compiles gui_wgpu.
        features:
          - gstreamer
          - gui_linux
          - gui_linux,gstreamer
          - gui_windows
          - onnxruntime
          - burn_demos
    steps:
      - name: Prepare the CI host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@develop
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}
          fetch-depth: '1'

      # GStreamer is source-built into the image: never fix a failure by apt-installing libgstreamer*-dev.
      - name: cargo check --features ${{ matrix.features }}
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: ${{ env.CONTAINER_ENV }}
          script: >-
            bash -lc 'set -e;
            git config --global --add safe.directory /workspace || true;
            cargo check --locked --features ${{ matrix.features }}'
