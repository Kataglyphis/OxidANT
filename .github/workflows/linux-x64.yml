# Linux x64 lane: only when and which runner; every step lives in reusable-linux.yml, the docs site in docs.yml.
name: Linux x64 · build + test

# The one lane every push to develop runs; release.yml calls it on main (third_party/ANTfrastructure/docs/branch-and-release-strategy.md).
on:
  push:
    branches: [ "develop" ]
  workflow_call:
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

# The GHCR pull uses its own secret; this also caps the called workflow's token.
permissions:
  contents: read

# Per lane and caller: the literal name keeps lanes apart, github.workflow (the caller's when called) keeps callers apart.
concurrency:
  group: linux-x64-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  # No timeout-minutes: a job that calls a reusable workflow may not carry one.
  build:
    name: Linux x64
    uses: ./.github/workflows/reusable-linux.yml
    permissions:
      contents: read
      # reusable-linux.yml's compiler-cache-save deletes its key's older entries.
      actions: write
    with:
      runner: ubuntu-26.04
      platform: linux/amd64
      arch: x64
      artifact-suffix: ubuntu-26.04-x64
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  # In the image: its pwsh carries the pinned Pester; the Windows-only cases skip off Windows.
  pester-linux:
    name: Pester suites on Linux (scripts/windows/tests)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Prepare CI host (checkout + pull the family Linux image)
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@develop
        with:
          fetch-depth: '1'
          submodules: 'true'
          free-disk-space: 'true'
          pull-first: 'false'

      - name: Run scripts/windows/tests under the image's Pester 6.2.0
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          script: pwsh -NoProfile -File third_party/ANTfrastructure/.github/actions/run-pester-suite/Invoke-PesterSuite.ps1 -Path scripts/windows/tests -Version 6.2.0
