# Linux x64 lane: only when and which runner; every step lives in reusable-linux.yml, and only this arch publishes the docs.
name: Linux x64 · build + test

# The one lane every push to develop runs; release.yml calls it on main (third_party/ANTfrastructure/docs/branch-and-release-strategy.md).
on:
  push:
    branches: [ "develop" ]
  workflow_call:
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:
    inputs:
      feature-checks-per-job:
        description: >-
          One feature-check job per set, the layout before 2026-10-13: six image
          pulls instead of one, for when the shared job is in doubt.
        type: boolean
        default: false

# The GHCR pull and docs publish use their own secrets; this also caps the called workflow's token.
permissions:
  contents: read

# A literal name: in a called workflow github.workflow is the caller's; default-branch runs (docs) always finish.
concurrency:
  group: linux-x64-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  # No timeout-minutes: a job that calls a reusable workflow may not carry one.
  build:
    name: Linux x64
    uses: ./.github/workflows/reusable-linux.yml
    permissions:
      contents: read
      # reusable-linux.yml's compiler-cache-save deletes its key's older entries.
      actions: write
    with:
      runner: ubuntu-26.04
      platform: linux/amd64
      arch: x64
      artifact-suffix: ubuntu-26.04-x64
      docs: true
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
      SERVER: ${{ secrets.SERVER }}
      USERNAME: ${{ secrets.USERNAME }}
      PW: ${{ secrets.PW }}

  # The only build of each optional feature, on every push like the lane (owner rule: no opt-in jobs).
  feature-matrix:
    name: Feature checks (${{ matrix.sets }})
    runs-on: ubuntu-26.04
    # Every set in one job: a check takes 1-3 min, the host prologue 6-9 min (runs 38394017265, 38400294322, 38407158265).
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # The image's CARGO_HOME is root-owned and the container runs as uid 1001.
      CONTAINER_ENV: -e CARGO_HOME=/tmp/cargo-home -e CARGO_TERM_COLOR=always
    strategy:
      fail-fast: false
      matrix:
        # `all` is FEATURE_CHECK_SETS in scripts/linux/ci-container-steps.sh; the dispatch input splits it into one job per set.
        sets: ${{ fromJSON(inputs.feature-checks-per-job && '["gstreamer", "gui_linux", "gui_linux,gstreamer", "gui_windows", "onnxruntime", "burn_demos"]' || '["all"]') }}
    steps:
      - name: Prepare the CI host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@develop
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}
          fetch-depth: '1'

      # GStreamer is source-built into the image: never fix a failure by apt-installing libgstreamer*-dev.
      - name: cargo check per feature set (${{ matrix.sets }})
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: ${{ env.CONTAINER_ENV }}
          script: bash -lc 'bash scripts/linux/ci-container-steps.sh feature-check ${{ matrix.sets }}'
