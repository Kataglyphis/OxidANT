# Linux x64 lane: only when and which runner; every step lives in reusable-linux.yml, the docs site in docs.yml.
name: Linux x64 · build + test

# The one lane every push to develop runs; release.yml calls it on main (third_party/ANTfrastructure/docs/branch-and-release-strategy.md).
on:
  push:
    branches: [ "develop" ]
  workflow_call:
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

# The GHCR pull uses its own secret; this also caps the called workflow's token.
permissions:
  contents: read

# Per lane and caller: the literal name keeps lanes apart, github.workflow (the caller's when called) keeps callers apart.
concurrency:
  group: linux-x64-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  # No timeout-minutes: a job that calls a reusable workflow may not carry one.
  build:
    name: Linux x64
    uses: ./.github/workflows/reusable-linux.yml
    permissions:
      contents: read
      # reusable-linux.yml's compiler-cache-save deletes its key's older entries.
      actions: write
    with:
      runner: ubuntu-26.04
      platform: linux/amd64
      arch: x64
      artifact-suffix: ubuntu-26.04-x64
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

