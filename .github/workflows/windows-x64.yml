# The container half is scripts/windows/Invoke-WindowsLane.ps1, which a local container run executes too.
name: Windows x64 · build + test

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  contents: read

# A two-hour lane: superseded runs off the default branch cancel; default-branch runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  build:
    name: Build, test, package (x64)
    uses: Kataglyphis/ANTfrastructure/.github/workflows/container-ci-windows.yml@develop
    with:
      target-arch: amd64
      build-script: scripts/windows/Invoke-WindowsLane.ps1
      build-args: |
        -TargetArch
        amd64
      # 2500M: until the prune, two x64-windows entries share the 10 GB quota with both cargo caches.
      container-env: |
        CARGO_TERM_COLOR=always
        SCCACHE_CACHE_SIZE=2500M
      # Invoke-WindowsLane.ps1 moves CARGO_HOME and sccache in and out of the container-local dirs.
      compiler-cache-key: x64-windows
      version-file: VERSION.txt
      # Server Core lacks the opengl32.dll wgpu's gles backend imports, so the host runs the renderer tests and the exe.
      host-command: |
        ./scripts/windows/Invoke-HostTests.ps1 -ContainerRoot 'C:\ws'
        ./dist/windows-x64/bundle/kataglyphis_cli.exe onnx-runtime
        ./dist/windows-x64/bundle/kataglyphis_cli.exe media-check
      artifact-name: kataglyphis_cli-windows-x64
      artifact-dir: dist/windows-x64
      # Green runs take two to three hours; four still stops a hung step long before the six-hour default.
      timeout-minutes: 240
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  # The reusable lane can save the cache but not delete (contents: read), so this keeps the key to one entry.
  prune-compiler-cache:
    name: Prune the compiler cache
    needs: build
    # The save's own condition: pushes to the default branch only.
    if: >-
      ${{ always() && github.event_name == 'push'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete the x64-windows entries of older runs
        uses: Kataglyphis/ANTfrastructure/.github/actions/compiler-cache-prune@develop
        with:
          key: x64-windows
