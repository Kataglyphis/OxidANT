# .github/workflows/windows-x64.yml
#
# The Windows x64 lane: debug tests, the app config matrix, the lint + package
# build, then on the runner host the WebGPU renderer tests and a run of the
# packaged exe. A thin caller of ANTfrastructure's container-ci-windows.yml since
# 2026-09-25 (the family's hub reusable lanes); the container half is
# scripts/windows/Invoke-WindowsLane.ps1, which a local container run executes
# too. The products land in dist/windows-x64 and upload as one artifact, like
# the arm64 lane's.
#
# ALWAYS RUNS since 2026-09-24 (owner request): no job-level `if:`, and none may
# be added back. Family naming, same date: kebab-case files, one per platform +
# arch, display name '<Platform> <Arch> · <what>'.
name: Windows x64 · build + test

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  contents: read

# This lane is two hours long, so a run superseded by a newer push to a feature
# branch or PR is cancelled; runs on the default branch always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  build:
    name: Build, test, package (x64)
    uses: Kataglyphis/ANTfrastructure/.github/workflows/container-ci-windows.yml@develop
    with:
      target-arch: amd64
      build-script: scripts/windows/Invoke-WindowsLane.ps1
      build-args: |
        -TargetArch
        amd64
      container-env: |
        CARGO_TERM_COLOR=always
      version-file: VERSION.txt
      # The renderer's lib tests cannot start on Server Core: wgpu's gles backend
      # imports opengl32.dll, which it does not ship. The host has it, so the host
      # runs them, and runs the packaged exe to prove the chain ONNX Runtime loads.
      host-command: |
        ./scripts/windows/Invoke-HostTests.ps1 -ContainerRoot 'C:\ws'
        ./dist/windows-x64/bundle/kataglyphis_cli.exe onnx-runtime
      artifact-name: kataglyphis_cli-windows-x64
      artifact-dir: dist/windows-x64
      # The last green runs took 122 and 155 min; four hours still stops a hung
      # container step long before the six-hour default.
      timeout-minutes: 240
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
