# Linux arm64 lane: only when and which runner; every step lives in reusable-linux.yml, and linux-x64.yml owns the docs.
name: Linux arm64 · build + test

# On request only (third_party/ANTfrastructure/docs/branch-and-release-strategy.md): on-request.yml or by hand.
on:
  workflow_dispatch:
  workflow_call:

# Nothing here writes through GITHUB_TOKEN; the GHCR pull uses its own secret.
permissions:
  contents: read

# Per lane and caller: the literal name keeps lanes apart, github.workflow (the caller's when called) keeps callers apart.
concurrency:
  group: linux-arm64-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  # No timeout-minutes: a job that calls a reusable workflow may not carry one.
  build:
    name: Linux arm64
    uses: ./.github/workflows/reusable-linux.yml
    permissions:
      contents: read
      # reusable-linux.yml's compiler-cache-save deletes its key's older entries.
      actions: write
    with:
      runner: ubuntu-26.04-arm
      platform: linux/arm64
      arch: arm64
      artifact-suffix: ubuntu-26.04-arm64
      docs: false
    # Only the registry token: docs is false, so no step would use the FTP secrets.
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
