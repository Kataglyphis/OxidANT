# Cross-builds arm64 on an amd64 runner, then windows-11-arm runs it; what that skips: AGENTS.md § Continuous integration.
name: Windows arm64 · cross build + test

# On request only (third_party/ANTfrastructure/docs/branch-and-release-strategy.md): on-request.yml or by hand.
on:
  workflow_dispatch:
    inputs:
      parallel-renderer-tests:
        description: Run the renderer tests in parallel on windows-11-arm, to name the WARP crash (BACKLOG)
        type: boolean
        default: false
      debugger-stack:
        description: Run the first traced test under cdb first, for the stack of the arm64 fail-fast (BACKLOG)
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

# Per lane and caller: the literal name keeps lanes apart, github.workflow (the caller's when called) keeps callers apart.
concurrency:
  group: windows-arm64-cross-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  cross:
    name: Cross build (arm64)
    uses: Kataglyphis/ANTfrastructure/.github/workflows/container-ci-windows.yml@develop
    with:
      target-arch: arm64
      submodules: 'true'
      build-script: scripts/windows/Invoke-WindowsLane.ps1
      build-args: |
        -TargetArch
        arm64
        -StageTests
      # MSIX metadata and the GStreamer plugins come from Build-Windows.config.psd1, as for x64.
      container-env: |
        CARGO_TERM_COLOR=always
      version-file: Cargo.toml
      artifact-name: kataglyphis_cli-windows-arm64
      artifact-dir: dist/windows-arm64
      # The exe, the VC++ runtime and the chain ONNX Runtime at the least.
      arch-gate-min-inspected: 3
      # Proves the bundle's imports, chain ONNX Runtime and GStreamer plugins on a real device; the runner has no desktop for the GUI.
      run-command: |
        ./bundle/kataglyphis_cli.exe --help
        ./bundle/kataglyphis_cli.exe stats --path ./bundle/resources/web/redirect/index.html
        ./bundle/kataglyphis_cli.exe onnx-runtime
        ./bundle/kataglyphis_cli.exe media-check
      # The x64 lane's tests, the renderer's included, built for arm64 (Stage-CrossTests.ps1) and run natively (hub CON43).
      test-artifact-dir: dist/windows-arm64-tests
      # The binaries embed C:\ws (CARGO_MANIFEST_DIR, CARGO_BIN_EXE), junctioned to the staged mirror; GPU and model tests may not self-skip.
      test-command: |
        if (Test-Path -LiteralPath 'C:\ws') { throw 'C:\ws exists on the runner; the tests would read another tree' }
        $null = New-Item -ItemType Junction -Path 'C:\ws' -Target $PWD
        $env:KATAGLYPHIS_REQUIRE_GPU = '1'
        $env:KATAGLYPHIS_REQUIRE_MODEL = '1'
        # Dispatch-only: drops Stage-CrossTests.ps1's --test-threads=1 so the hub runner can name the parallel crash.
        if ('${{ inputs.parallel-renderer-tests }}' -eq 'true') {
          $manifest = @(Get-Content -Raw -LiteralPath tests.json | ConvertFrom-Json)
          foreach ($entry in $manifest) {
            if ($entry.PSObject.Properties['args']) { $entry.args = @($entry.args | Where-Object { $_ -ne '--test-threads=1' }) }
          }
          ConvertTo-Json -InputObject $manifest -Depth 4 | Set-Content -LiteralPath tests.json -Encoding utf8
          Write-Host 'Renderer tests run in parallel (dispatch input parallel-renderer-tests)'
        }
        # Dispatch-only: WER records nothing there (ForceQueue=1, AeDebug '-'), so cdb, which the image has, takes the stack.
        if ('${{ inputs.debugger-stack }}' -eq 'true') {
          $cdb = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Debuggers\arm64\cdb.exe'
          $traced = @(Get-Content -Raw -LiteralPath tests.json | ConvertFrom-Json | Where-Object { (Split-Path -Leaf $_.exe) -like 'traced_modes-*' })[0]
          Push-Location (Split-Path -Parent $traced.exe)
          try {
            & $cdb -lines -y 'srv*C:\symbols*https://msdl.microsoft.com/download/symbols' `
              -c 'sxe -c ".echo FAIL-FAST; .exr -1; kn 80; lmv m d3d10warp; q" c0000409; sxd -c2 ".echo SECOND-CHANCE-AV; .exr -1; kn 80; lmv m d3d10warp; q" av; g; q' `
              (Split-Path -Leaf $traced.exe) a_mask_cutout_lets_the_sun_through_in_both_traced_modes --exact --nocapture --test-threads=1
            Write-Host "cdb exited $LASTEXITCODE"
          } finally {
            Pop-Location
          }
          $global:LASTEXITCODE = 0
        }
        # The renderer's entries run in the lavapipe job below: WARP's arm64 JIT fails fast on a PAC check (BACKLOG).
        $warp = @(Get-Content -Raw -LiteralPath tests.json | ConvertFrom-Json | Where-Object { -not $_.PSObject.Properties['skip_pattern'] })
        ConvertTo-Json -InputObject $warp -Depth 4 | Set-Content -LiteralPath tests-warp.json -Encoding utf8
        & ./Invoke-StagedTests.ps1 -Manifest tests-warp.json
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  # Owner decision 2026-11-22: the renderer tests on Mesa's lavapipe through Vulkan, as BeschleunigerBallett's arm64 suites run.
  lavapipe-renderer:
    name: renderer tests on lavapipe (windows-11-arm)
    needs: cross
    runs-on: windows-11-arm
    # A job of its own: the hub's run job stops at 30 minutes, and lavapipe draws on the CPU.
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out this repository and the hub alone
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the hub's lavapipe provisioner and pins
        run: git submodule update --init --depth 1 third_party/ANTfrastructure

      - name: Download the tests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kataglyphis_cli-windows-arm64-tests
          path: tests

      # The binaries embed C:\ws (CARGO_MANIFEST_DIR), as in the WARP run; WGPU_BACKEND narrows adapter.rs's choice.
      - name: Run the renderer tests on lavapipe
        working-directory: tests
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = & ../third_party/ANTfrastructure/windows/scripts/host/Install-LavapipeHost.ps1
          $env:PATH = "$($tools.LoaderDir);$env:PATH"
          $env:WGPU_BACKEND = 'vulkan'
          $env:KATAGLYPHIS_REQUIRE_GPU = '1'
          $env:KATAGLYPHIS_REQUIRE_MODEL = '1'
          if (Test-Path -LiteralPath 'C:\ws') { throw 'C:\ws exists on the runner; the tests would read another tree' }
          $null = New-Item -ItemType Junction -Path 'C:\ws' -Target $PWD
          $renderer = @(Get-Content -Raw -LiteralPath tests.json | ConvertFrom-Json | Where-Object { $_.PSObject.Properties['skip_pattern'] })
          if ($renderer.Count -eq 0) { throw 'tests.json lists no renderer entry (none carries skip_pattern)' }
          ConvertTo-Json -InputObject $renderer -Depth 4 | Set-Content -LiteralPath tests-lavapipe.json -Encoding utf8
          & ./Invoke-StagedTests.ps1 -Manifest tests-lavapipe.json -AssertVerdict
