# Cross-builds arm64 on an amd64 runner, then windows-11-arm runs it; what that skips: AGENTS.md § Continuous integration.
name: Windows arm64 · cross build + test

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  contents: read

# Superseded runs off the default branch cancel; default-branch runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  cross:
    name: Cross build (arm64)
    uses: Kataglyphis/ANTfrastructure/.github/workflows/container-ci-windows.yml@develop
    with:
      target-arch: arm64
      build-script: scripts/windows/Invoke-WindowsLane.ps1
      build-args: |
        -TargetArch
        arm64
        -StageTests
      # Package features and MSIX metadata come from Build-Windows.config.psd1, as for x64.
      container-env: |
        CARGO_TERM_COLOR=always
      version-file: VERSION.txt
      artifact-name: kataglyphis_cli-windows-arm64
      artifact-dir: dist/windows-arm64
      # The exe, the VC++ runtime and the chain ONNX Runtime at the least.
      arch-gate-min-inspected: 3
      # Proves the bundle's imports, chain ONNX Runtime and GStreamer plugins on a real device; the runner has no desktop for the GUI.
      run-command: |
        ./bundle/kataglyphis_cli.exe --help
        ./bundle/kataglyphis_cli.exe stats --path ./bundle/resources/web/redirect/index.html
        ./bundle/kataglyphis_cli.exe onnx-runtime
        ./bundle/kataglyphis_cli.exe media-check
      # The x64 lane's tests, the renderer's included, built for arm64 (Stage-CrossTests.ps1) and run natively (hub CON43).
      test-artifact-dir: dist/windows-arm64-tests
      # The binaries embed C:\ws (CARGO_MANIFEST_DIR, CARGO_BIN_EXE), junctioned to the staged mirror; GPU tests may not self-skip.
      test-command: |
        if (Test-Path -LiteralPath 'C:\ws') { throw 'C:\ws exists on the runner; the tests would read another tree' }
        $null = New-Item -ItemType Junction -Path 'C:\ws' -Target $PWD
        $env:KATAGLYPHIS_REQUIRE_GPU = '1'
        & ./Invoke-StagedTests.ps1
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
