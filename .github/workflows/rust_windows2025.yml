name: Rust workflow on Windows 2025
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: pwsh

jobs:
  windows-pipeline:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message || '', '[build-win]') }}
    name: Build, test, and package (windows-2025)
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    # NO WINDOWS_CONTAINER_IMAGE HERE, DELIBERATELY. It held the full image
    # reference and fed all five container steps below - a COPY of a value
    # ANTfrastructure already owns (versions.env's IMAGE_REGISTRY_PREFIX +
    # CI_IMAGE_WINDOWS_TAG), so a fleet-wide tag bump landed everywhere except
    # here. Not repeated in this comment either: a literal in a comment rots the
    # same way, and verify_ci_image_refs.py check D reads comments too.
    #
    # Both Windows container actions carry that composed ref as their `image:`
    # input DEFAULT, so omitting the input is how this lane says "the family
    # Windows image" - the route their input docs prescribe ("SINGLE SOURCE OF
    # TRUTH: omit this input").
    env:
      BINARY: kataglyphis_cli
      WINDOWS_DOCKER_CPUS: '4'
      WINDOWS_DOCKER_MEMORY: 16g
      WINDOWS_PACKAGE_FEATURES: gui_windows,onnxruntime_directml
      # Provide inputs for version computation script
      REF_NAME: ${{ github.ref_name }}
      RUN_NUMBER: ${{ github.run_number }}
      MSIX_PACKAGE_NAME: Kataglyphis.OxidANT
      MSIX_PUBLISHER: CN=Kataglyphis
      MSIX_PUBLISHER_DISPLAY_NAME: Kataglyphis
      MSIX_DISPLAY_NAME: OxidANT
      MSIX_DESCRIPTION: Rust project template with optional GUI, ONNX backends, profiling, packaging, and CI workflows.

    steps:
      # Der komplette Prolog - long paths, Checkout ohne Submodule,
      # Kurzpfad-Klon, data-root auf D:, Disk-Cleanup, Registry-Login, Pull,
      # Disk-Report - kommt aus ANTfrastructure. Er war hier ~50 Zeilen und in drei
      # Schwester-Repos identisch.
      #
      # Der Kurzpfad-Klon bleibt Pflicht: die Kette OxidANT ->
      # ANTfrastructure -> DocumANTation -> md2pdfLib -> latex/{smile,awesome-beamer}
      # reisst .git/modules/.../pack-*.keep ueber 260 Zeichen, und ein rekursiver
      # Checkout stirbt mit "Filename too long" bzw. "'$GIT_DIR' too big".
      #
      # required-free-gb ersetzt den separaten assert-docker-disk-space-Schritt:
      # die Action prueft die ZIELplatte, bevor sie die data-root dorthin
      # verschiebt - also frueher, und auf genau dem Laufwerk, auf dem das Image
      # dann landet.
      - name: Prepare Windows container host
        id: prep
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-windows-container-host@main
        with:
          registry-password: ${{ secrets.GHCR_PAT }}
          fetch-depth: 0
          short-path-target: /d/ws
          required-free-gb: '70'

      # working-directory is the short-path clone, not github.workspace: with a
      # short-path-target set, prepare-windows-container-host deliberately takes
      # NO submodules in the runner checkout, so third_party/ANTfrastructure is an
      # empty directory there and this step died on its own submodule guard. The
      # `workspace` output exists for exactly this.
      - name: Compute version
        id: compute-version
        shell: bash
        working-directory: ${{ steps.prep.outputs.workspace }}
        run: scripts/compute-version.sh

      # The four container steps below used to be hand-written `docker run`
      # blocks repeating --memory/--cpus/--mount/-w twelve times between them.
      # ANTfrastructure's action carries those defaults (D:\ws -> C:\ws, 16g) and,
      # unlike the hand-rolled version, delivers the command and its arguments
      # through environment variables rather than interpolating them into a
      # shell line - so a value containing a quote or a `$` cannot escape into
      # the host's PowerShell. `file:` + `file-args:` is the documented form for
      # "a script plus an argument vector": under -File every file-args line is
      # one literal argv element, with no PowerShell parsing of its value.
      - name: Run debug unit, integration, and fuzz tests
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-windows-container@main
        with:
          cpus: ${{ env.WINDOWS_DOCKER_CPUS }}
          memory: ${{ env.WINDOWS_DOCKER_MEMORY }}
          file: C:\ws\scripts\windows\Invoke-DebugTests.ps1
          extra-args: |
            --env
            CARGO_TERM_COLOR=${{ env.CARGO_TERM_COLOR }}
            --env
            CARGO_BUILD_JOBS=${{ env.WINDOWS_DOCKER_CPUS }}

      - name: Build and run all Windows app configs
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-windows-container@main
        with:
          cpus: ${{ env.WINDOWS_DOCKER_CPUS }}
          memory: ${{ env.WINDOWS_DOCKER_MEMORY }}
          file: C:\ws\scripts\windows\Invoke-WindowsConfigMatrix.ps1
          extra-args: |
            --env
            CARGO_TERM_COLOR=${{ env.CARGO_TERM_COLOR }}
            --env
            CARGO_BUILD_JOBS=${{ env.WINDOWS_DOCKER_CPUS }}

      # VERSION deliberately carries MSIX_VERSION (the four-component form)
      # here, as it did before: this step is the one that stamps the package.
      - name: Build, lint, and package MSIX/MSI
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-windows-container@main
        with:
          cpus: ${{ env.WINDOWS_DOCKER_CPUS }}
          memory: ${{ env.WINDOWS_DOCKER_MEMORY }}
          file: C:\ws\scripts\windows\Build-Windows.ps1
          file-args: |
            -SkipTests
          extra-args: |
            --env
            BINARY=${{ env.BINARY }}
            --env
            VERSION=${{ env.MSIX_VERSION }}
            --env
            CARGO_TERM_COLOR=${{ env.CARGO_TERM_COLOR }}
            --env
            CARGO_BUILD_JOBS=${{ env.WINDOWS_DOCKER_CPUS }}
            --env
            CARGO_FEATURES=${{ env.WINDOWS_PACKAGE_FEATURES }}
            --env
            MSIX_PACKAGE_NAME=${{ env.MSIX_PACKAGE_NAME }}
            --env
            MSIX_PUBLISHER=${{ env.MSIX_PUBLISHER }}
            --env
            MSIX_PUBLISHER_DISPLAY_NAME=${{ env.MSIX_PUBLISHER_DISPLAY_NAME }}
            --env
            MSIX_DISPLAY_NAME=${{ env.MSIX_DISPLAY_NAME }}
            --env
            MSIX_DESCRIPTION=${{ env.MSIX_DESCRIPTION }}
            --env
            MSIX_VERSION=${{ env.MSIX_VERSION }}

      - name: Prepare archive variables
        id: vars
        run: |
          # Use version computed by shared script
          $ver = "$env:VERSION"
          $archive = "$env:BINARY-$ver-windows-2025-x64.zip"
          echo "archive_name=$archive" >> $env:GITHUB_OUTPUT
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Create archive
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-windows-container@main
        with:
          cpus: ${{ env.WINDOWS_DOCKER_CPUS }}
          memory: ${{ env.WINDOWS_DOCKER_MEMORY }}
          file: C:\ws\third_party\ANTfrastructure\windows\scripts\rust\New-Archive.ps1
          extra-args: |
            --env
            BINARY=${{ env.BINARY }}
            --env
            VERSION=${{ steps.vars.outputs.version }}
            --env
            PLATFORM=windows-2025
            --env
            ARCH=x64
            --env
            CARGO_BUILD_JOBS=${{ env.WINDOWS_DOCKER_CPUS }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.BINARY }}-${{ steps.vars.outputs.version }}-windows-2025-x64
          path: ${{ steps.prep.outputs.workspace }}/dist/${{ steps.vars.outputs.archive_name }}

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.MSIX_PACKAGE_NAME }}-${{ steps.vars.outputs.version }}-x64-msix
          path: ${{ steps.prep.outputs.workspace }}/dist/msix/*.msix

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.BINARY }}-${{ steps.vars.outputs.version }}-x64-msi
          path: ${{ steps.prep.outputs.workspace }}/dist/msi/*.msi


