# .github/workflows/submodule-pins.yml
# This repository has one submodule, third_party/ANTfrastructure, and every gate
# here comes out of it: the container images both build lanes run in, the
# shellcheck/actionlint/gitleaks binaries the lint gate bootstraps, the
# packaging and docs scripts, the Windows modules. A drifted gitlink does not
# degrade one job - it silently changes every gate this repo has, and
# `git submodule status` marks it with a '+' that is easy to miss in a wall of
# CI output.
#
# ONE `uses:` SINCE 2026-09-15. This file used to carry the job itself plus
# forty lines explaining the Pester pin and the Windows runner - the third
# near-copy of the same thing in the family. ANTfrastructure's
# submodule-pins.yml is callable now, so the job, the runner choice, the Pester
# version and their rationale live upstream once
# (third_party/ANTfrastructure/docs/windows-builds.md), and what stays here is
# the only part that is this repo's: WHEN the lane runs.
#
# The suite is repo-agnostic and takes the superproject root as a parameter, so
# nothing here has to name ANTfrastructure for it to be covered and a second
# submodule added later is covered the day it lands. The path input defaults to
# this repo's own vendored location, which is why it is not passed.
name: Submodule pins

on:
  push:
    branches: ["main", "develop"]
    paths:
      - '.gitmodules'
      - 'third_party/**'
      - '.github/workflows/submodule-pins.yml'
  pull_request:
    branches: ["main", "develop"]
    paths:
      - '.gitmodules'
      - 'third_party/**'
      - '.github/workflows/submodule-pins.yml'

permissions:
  contents: read

concurrency:
  group: submodule-pins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pins:
    uses: Kataglyphis/ANTfrastructure/.github/workflows/submodule-pins.yml@develop
